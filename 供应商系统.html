<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>供应链协同平台 - 订单确认与反馈</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <style>
        /* ===== CSS 变量 & 重置 (同上，略作调整) ===== */
        :root {
            --primary: #4F46E5;
            --primary-light: #818CF8;
            --primary-dark: #3730A3;
            --primary-gradient: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --gray-50: #F8FAFC;
            --gray-100: #F1F5F9;
            --gray-200: #E2E8F0;
            --gray-300: #CBD5E1;
            --gray-400: #94A3B8;
            --gray-500: #64748B;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1E293B;
            --gray-900: #0F172A;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--gray-100);
            color: var(--gray-800);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gray-900);
            background-image: radial-gradient(ellipse at 20% 50%, rgba(79, 70, 229, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(124, 58, 237, 0.15) 0%, transparent 60%);
        }

        .hidden {
            display: none !important;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            gap: 8px;
        }
        .btn-primary {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.45);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-success {
            background: #10B981;
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #EF4444;
            color: #fff;
        }
        .btn-danger:hover {
            background: #DC2626;
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            color: var(--gray-600);
            border: 1.5px solid var(--gray-300);
        }
        .btn-outline:hover {
            background: var(--gray-100);
            border-color: var(--gray-400);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
        }
        .btn-block {
            width: 100%;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: var(--shadow-lg);
        }

        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-success {
            background: #D1FAE5;
            color: #065F46;
        }
        .badge-warning {
            background: #FEF3C7;
            color: #92400E;
        }
        .badge-danger {
            background: #FEE2E2;
            color: #991B1B;
        }
        .badge-info {
            background: #DBEAFE;
            color: #1E40AF;
        }
        .badge-secondary {
            background: #E5E7EB;
            color: #4B5563;
        }
        .badge-notification {
            background: #EF4444;
            color: #fff;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        /* ===== 登录页面 ===== */
        #loginPage {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            min-height: 540px;
        }
        .login-left {
            flex: 1;
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
        }
        .login-left .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .login-left .logo svg {
            width: 36px;
            height: 36px;
        }
        .login-left .logo span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
        }
        .login-left .logo span .highlight {
            color: var(--primary);
        }
        .login-left h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-top: 16px;
            margin-bottom: 8px;
        }
        .login-left .subtitle {
            color: var(--gray-500);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }
        .login-left .form-group {
            margin-bottom: 20px;
        }
        .login-left .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 6px;
        }
        .login-left .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            transition: var(--transition);
            background: var(--gray-50);
        }
        .login-left .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            background: #fff;
        }
        .login-left .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            margin-top: 8px;
        }
        .login-left .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 12px;
            min-height: 24px;
            text-align: center;
        }
        .login-left .test-accounts {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--gray-200);
        }
        .login-left .test-accounts p {
            font-size: 0.8rem;
            color: var(--gray-500);
            margin-bottom: 8px;
        }
        .login-left .test-accounts .accounts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .login-left .test-accounts .account-item {
            background: var(--gray-50);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: monospace;
            color: var(--gray-600);
            border: 1px solid var(--gray-200);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }
        .login-left .test-accounts .account-item:hover {
            background: var(--gray-100);
            border-color: var(--primary);
        }
        .login-left .test-accounts .account-item .role-tag {
            display: inline-block;
            font-size: 0.6rem;
            padding: 1px 8px;
            border-radius: 999px;
            margin-left: 4px;
        }
        .role-tag-supplier {
            background: #DBEAFE;
            color: #1E40AF;
        }
        .role-tag-customer {
            background: #D1FAE5;
            color: #065F46;
        }
        .login-right {
            flex: 1;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 40px;
            color: #fff;
            flex-direction: column;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .login-right::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
            animation: rotateBg 30s linear infinite;
        }
        @keyframes rotateBg {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .login-right .content {
            position: relative;
            z-index: 1;
        }
        .login-right .icon-big {
            font-size: 4.5rem;
            margin-bottom: 16px;
            display: block;
        }
        .login-right h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .login-right p {
            opacity: 0.85;
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 340px;
        }
        .login-right .features {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
            max-width: 300px;
        }
        .login-right .features .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .login-right .features .feature-item span {
            font-size: 1.2rem;
        }

        /* ===== 仪表板 ===== */
        #dashboardPage {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--gray-100);
        }

        .topbar {
            background: #fff;
            padding: 0 32px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--gray-200);
        }
        .topbar .left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .topbar .left .brand {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gray-900);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topbar .left .brand svg {
            width: 28px;
            height: 28px;
        }
        .topbar .left .brand .highlight {
            color: var(--primary);
        }
        .topbar .left .role-badge {
            font-size: 0.7rem;
            padding: 4px 14px;
            border-radius: 999px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .role-badge-supplier {
            background: #DBEAFE;
            color: #1E40AF;
        }
        .role-badge-customer {
            background: #D1FAE5;
            color: #065F46;
        }
        .topbar .right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .topbar .right .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }
        .topbar .right .user-info .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .topbar .right .user-info .name {
            font-weight: 600;
            color: var(--gray-800);
        }
        .topbar .right .user-info .company {
            color: var(--gray-500);
            font-size: 0.8rem;
        }

        .dashboard-body {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .sidebar {
            width: 220px;
            background: #fff;
            border-right: 1px solid var(--gray-200);
            padding: 20px 0;
            flex-shrink: 0;
            overflow-y: auto;
        }
        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 24px;
            margin: 2px 12px;
            border-radius: var(--radius-sm);
            color: var(--gray-600);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            border: none;
            background: transparent;
            width: calc(100% - 24px);
            position: relative;
        }
        .sidebar .nav-item:hover {
            background: var(--gray-100);
            color: var(--gray-800);
        }
        .sidebar .nav-item.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .sidebar .nav-item .icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar .nav-item .notification-dot {
            background: #EF4444;
            color: #fff;
            border-radius: 999px;
            padding: 0 8px;
            font-size: 0.65rem;
            font-weight: 700;
            line-height: 18px;
            margin-left: auto;
            animation: pulse 1.5s infinite;
        }
        .sidebar .nav-section {
            padding: 16px 24px 8px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--gray-400);
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            padding: 24px 32px 32px;
            overflow-y: auto;
            background: var(--gray-50);
        }
        .main-content .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 6px;
        }
        .main-content .page-subtitle {
            color: var(--gray-500);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: #fff;
            padding: 20px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-200);
            transition: var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .stat-card .stat-label {
            font-size: 0.8rem;
            color: var(--gray-500);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-top: 4px;
        }

        .table-wrapper {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .table-wrapper .table-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .table-wrapper .table-header h3 {
            font-size: 1rem;
            font-weight: 600;
        }
        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .table-wrapper table th {
            text-align: left;
            padding: 12px 20px;
            background: var(--gray-50);
            font-weight: 600;
            color: var(--gray-600);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--gray-200);
        }
        .table-wrapper table td {
            padding: 12px 20px;
            border-bottom: 1px solid var(--gray-100);
            color: var(--gray-700);
        }
        .table-wrapper table tr:last-child td {
            border-bottom: none;
        }
        .table-wrapper table tr:hover td {
            background: var(--gray-50);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .product-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--gray-200);
            text-align: center;
            transition: var(--transition);
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
        }
        .product-card .product-code {
            font-size: 0.8rem;
            color: var(--gray-500);
            font-family: monospace;
        }
        .product-card .product-short {
            font-weight: 600;
            font-size: 1.1rem;
            margin: 4px 0;
        }
        .product-card .product-full {
            font-size: 0.85rem;
            color: var(--gray-600);
            margin-bottom: 4px;
        }
        .product-card .product-supplier {
            font-size: 0.7rem;
            color: var(--gray-400);
            margin-top: 4px;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .modal {
            background: #fff;
            border-radius: var(--radius);
            max-width: 600px;
            width: 100%;
            padding: 32px;
            box-shadow: var(--shadow-xl);
            animation: fadeIn 0.25s ease-out;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .modal .modal-sub {
            color: var(--gray-500);
            margin-bottom: 20px;
        }
        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 4px;
        }
        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            transition: var(--transition);
            background: var(--gray-50);
            font-family: inherit;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            background: #fff;
        }
        .modal .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .modal .form-actions .btn {
            flex: 1;
        }
        .modal table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        .modal table th {
            text-align: left;
            padding: 6px 8px;
            background: var(--gray-50);
            font-weight: 600;
            font-size: 0.8rem;
            border-bottom: 1px solid var(--gray-200);
        }
        .modal table td {
            padding: 6px 8px;
            border-bottom: 1px solid var(--gray-100);
            font-size: 0.9rem;
        }
        .modal table tr:last-child td {
            border-bottom: none;
        }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed var(--gray-300);
            border-radius: var(--radius-sm);
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--gray-50);
            margin: 16px 0;
        }
        .upload-area:hover {
            border-color: var(--primary);
            background: #EEF2FF;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .upload-area .upload-icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 8px;
        }
        .upload-area .upload-text {
            color: var(--gray-500);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray-500);
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
        }

        .fade-in {
            animation: fadeIn 0.35s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 下单表格 */
        .order-table-wrap {
            overflow-x: auto;
        }
        .order-table-wrap table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .order-table-wrap table th {
            background: var(--gray-50);
            padding: 10px 14px;
            text-align: left;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gray-600);
            border-bottom: 1px solid var(--gray-200);
        }
        .order-table-wrap table td {
            padding: 8px 14px;
            border-bottom: 1px solid var(--gray-100);
            vertical-align: middle;
        }
        .order-table-wrap table tr:hover td {
            background: var(--gray-50);
        }
        .order-table-wrap input[type="number"] {
            width: 80px;
            padding: 6px 8px;

            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                max-width: 440px;
                min-height: auto;
            }

            }
            .login-right {

                min-height: 200px;
            }
            .login-right .features {
                display: none;
            }
            .dashboard-body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--gray-200);
                padding: 8px 0;
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                justify-content: center;
                background: #fff;
                position: sticky;
                top: 64px;
                z-index: 99;
            }
            .sidebar .nav-item {
                padding: 8px 16px;
                margin: 2px 4px;
                width: auto;
                font-size: 0.8rem;
            }
            .sidebar .nav-item .icon {
                font-size: 1rem;
                width: 20px;
            }
            .sidebar .nav-section {
                display: none;
            }
            .topbar {
                padding: 0 16px;
                flex-wrap: wrap;
                height: auto;
                min-height: 56px;
                gap: 8px;
            }
            .topbar .left .brand {
                font-size: 0.95rem;
            }
            .topbar .right .user-info .company {
                display: none;
            }
            .main-content {
                padding: 16px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .table-wrapper {
                overflow-x: auto;
            }
            .table-wrapper table {
                font-size: 0.8rem;
                min-width: 500px;
            }
            .table-wrapper table th,
            .table-wrapper table td {
                padding: 8px 12px;
            }
            .modal {
                margin: 20px;
                padding: 24px;
                max-width: 100%;
            }
            .order-table-wrap input[type="number"] {
                width: 60px;
            }
        }
        @media (max-width: 480px) {
            .login-left .test-accounts .accounts-grid {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--gray-100);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gray-400);
        }

</head>
<body>

    <!-- ============================================================ -->
    <!-- JavaScript -->
    <!-- ============================================================ -->
    <script>
        // ================================================================
        //  数据层 (localStorage 持久化)
        // ================================================================

        const STORAGE_KEY_PRODUCTS = 'scm_products_v5';
        const STORAGE_KEY_ORDERS = 'scm_orders_v5';

        // 预设用户
        const USERS = [{
            id: 1,
            username: 'supplier1',
            password: '123456',
            role: 'supplier',
            name: '张供应',
            company: '江门中远海运铝业',
            avatar: '张'
        }, {
            id: 2,
            username: 'customer1',
            password: '123456',
            role: 'customer',
            name: '卓锐采购',
            company: '卓锐',
            avatar: '卓'
        }];

        const DEFAULT_PRODUCTS = [];
        const DEFAULT_ORDERS = [];

        // 工具函数
        function loadData(key, defaultData) {
            const stored = localStorage.getItem(key);
            if (stored) {
                try { return JSON.parse(stored); } catch (e) { /* ignore */ }
            }
            return defaultData;
        }

        function saveData(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }

        function getProducts() {
            let products = loadData(STORAGE_KEY_PRODUCTS, null);
            if (!products || products.length === 0) {
                products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
                saveData(STORAGE_KEY_PRODUCTS, products);
            }
            return products;
        }

        function setProducts(products) {
            saveData(STORAGE_KEY_PRODUCTS, products);
        }

        function getOrders() {
            let orders = loadData(STORAGE_KEY_ORDERS, null);
            if (!orders || orders.length === 0) {
                orders = JSON.parse(JSON.stringify(DEFAULT_ORDERS));
                saveData(STORAGE_KEY_ORDERS, orders);
            }
            return orders;
        }

        function setOrders(orders) {
            saveData(STORAGE_KEY_ORDERS, orders);
        }

        function generateOrderId() {
            const now = new Date();
            const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate())
                .padStart(2, '0');
            const orders = getOrders();
            const count = orders.filter(o => o.id.startsWith('ORD-' + dateStr)).length + 1;
            return 'ORD-' + dateStr + '-' + String(count).padStart(3, '0');
        }

        // 添加新订单
        function addOrder(items, deliveryDate, note, customerCompany, supplierCompany) {
            const orders = getOrders();
            const validItems = items.filter(item => item.quantity > 0);
            if (validItems.length === 0) return null;

            const newOrder = {
                id: generateOrderId(),
                supplier: supplierCompany,
                customer: customerCompany,
                items: validItems.map(item => ({
                    productCode: item.code,
                    productShort: item.shortName,
                    productFull: item.fullName,
                    quantity: item.quantity
                })),
                deliveryDate: deliveryDate,
                note: note || '',
                status: '待确认', // 待确认, 已同意, 已拒绝
                responseNote: '', // 供应商反馈备注
                date: new Date().toISOString().slice(0, 10),
                read: false
            };
            orders.push(newOrder);
            setOrders(orders);
            return newOrder;
        }

        // 供应商处理订单
        function respondOrder(orderId, status, responseNote) {
            const orders = getOrders();
            const order = orders.find(o => o.id === orderId);
            if (!order) return false;
            if (order.status !== '待确认') return false; // 只能处理待确认订单
            order.status = status;
            order.responseNote = responseNote || '';
            setOrders(orders);
            return true;
        }

        function getUnreadCountForSupplier(supplierCompany) {
            const orders = getOrders();
            return orders.filter(o => o.supplier === supplierCompany && o.status === '待确认' && !o.read).length;
        }

        // ================================================================
        //  状态管理
        // ================================================================

        let currentUser = null;
        let currentNav = 'overview';

        // ================================================================
        //  DOM 引用
        // ================================================================

        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const loginPage = $('#loginPage');
        const dashboardPage = $('#dashboardPage');
        const loginForm = $('#loginForm');
        const usernameInput = $('#username');
        const passwordInput = $('#password');
        const loginError = $('#loginError');
        const logoutBtn = $('#logoutBtn');
        const sidebar = $('#sidebar');
        const mainContent = $('#mainContent');
        const roleBadge = $('#roleBadge');
        const userDisplayName = $('#userDisplayName');
        const userCompany = $('#userCompany');
        const userAvatar = $('#userAvatar');
        const modalContainer = $('#modalContainer');

        // ================================================================
        //  工具函数
        // ================================================================

        function getStatusBadge(status) {
            const map = {
                '已完成': 'badge-success',
                '配送中': 'badge-info',
                '待审核': 'badge-warning',
                '待付款': 'badge-danger',
                '待确认': 'badge-warning',
                '已同意': 'badge-success',
                '已拒绝': 'badge-danger',
            };
            return map[status] || 'badge-secondary';
        }

        function getUserOrders(user) {
            const orders = getOrders();
            if (user.role === 'supplier') {
                return orders.filter(o => o.supplier === user.company);
            } else {
                return orders.filter(o => o.customer === user.company);
            }
        }

        function getUserProducts(user) {
            const products = getProducts();
            if (user.role === 'supplier') {
                return products.filter(p => p.supplier === user.company);
            } else {
                return products;
            }
        }

        function getStats(user) {
            const orders = getUserOrders(user);
            const products = getUserProducts(user);
            const statusCount = {};
            orders.forEach(o => { statusCount[o.status] = (statusCount[o.status] || 0) + 1; });
            const pendingCount = (statusCount['待确认'] || 0) + (statusCount['待审核'] || 0) + (statusCount['待付款'] || 0);
            let totalItems = 0;
            orders.forEach(o => {
                if (o.items) {
                    o.items.forEach(item => totalItems += item.quantity);
                }
            });
            return {
                orderCount: orders.length,
                productCount: products.length,
                totalItems: totalItems,
                statusCount: statusCount,
                pendingCount: pendingCount,
                unreadCount: user.role === 'supplier' ? getUnreadCountForSupplier(user.company) : 0,
            };
        }

        function getMinDeliveryDate() {
            const d = new Date();
            d.setDate(d.getDate() + 28);
            return d.toISOString().slice(0, 10);
        }

        // ================================================================
        //  渲染函数
        // ================================================================

        function renderSidebar(user) {
            const isSupplier = user.role === 'supplier';
            const unread = isSupplier ? getUnreadCountForSupplier(user.company) : 0;

            const navItems = isSupplier ? [
                { id: 'overview', icon: '📊', label: '总览' },
                { id: 'orders', icon: '📦', label: '订单管理' },
                { id: 'products', icon: '📋', label: '产品管理' },
            ] : [
                { id: 'overview', icon: '📊', label: '总览' },
                { id: 'orders', icon: '📦', label: '我的订单' },
                { id: 'products', icon: '🛒', label: '下单采购' },
            ];

            let html = `<div class="nav-section">${isSupplier ? '供应商' : '客户'} 菜单</div>`;
            navItems.forEach(item => {
                const active = item.id === currentNav ? 'active' : '';
                let notification = '';
                if (item.id === 'orders' && unread > 0) {
                    notification = `<span class="notification-dot">${unread}</span>`;
                }
                html += `
                    <button class="nav-item ${active}" data-nav="${item.id}">
                        <span class="icon">${item.icon}</span>
                        ${item.label}
                        ${notification}
                    </button>
                `;
            });
            sidebar.innerHTML = html;

            sidebar.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentNav = btn.dataset.nav;
                    if (currentNav === 'orders' && user.role === 'supplier') {
                        // 标记已读
                        const orders = getOrders();
                        let changed = false;
                        orders.forEach(o => {
                            if (o.supplier === user.company && o.status === '待确认' && !o.read) {
                                o.read = true;
                                changed = true;
                            }
                        });
                        if (changed) setOrders(orders);
                    }
                    renderSidebar(user);
                    renderMainContent(user);
                });
            });
        }

        function renderMainContent(user) {
            const isSupplier = user.role === 'supplier';
            const stats = getStats(user);
            const orders = getUserOrders(user);
            const products = getUserProducts(user);

            let html = '';

            // ---- 总览 ----
            if (currentNav === 'overview') {
                html = `
                    <div class="fade-in">
                        <h1 class="page-title">👋 您好，${user.name}</h1>
                        <p class="page-subtitle">欢迎回到供应链协同平台，以下是您的数据概览</p>

                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-label">📦 订单总数</div>
                                <div class="stat-value">${stats.orderCount}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">📋 产品数</div>
                                <div class="stat-value">${stats.productCount}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">⏳ 待处理</div>
                                <div class="stat-value">${stats.pendingCount}</div>
                            </div>
                            ${isSupplier ? `
                            <div class="stat-card" style="border-color: ${stats.unreadCount > 0 ? 'var(--danger)' : 'var(--gray-200)'};">
                                <div class="stat-label">🔔 新订单通知</div>
                                <div class="stat-value" style="color: ${stats.unreadCount > 0 ? 'var(--danger)' : 'var(--gray-400)'}">
                                    ${stats.unreadCount > 0 ? stats.unreadCount + ' 条未读' : '无'}
                                </div>
                            </div>
                            ` : ''}
                        </div>

                        <div class="card" style="margin-bottom:20px;">
                            <h3 style="margin-bottom:12px; font-size:1rem;">📈 订单状态分布</h3>
                            <div style="display:flex; gap:24px; flex-wrap:wrap;">
                                ${Object.entries(stats.statusCount).map(([status, count]) => `
                                    <div>
                                        <span class="badge ${getStatusBadge(status)}">${status}</span>
                                        <span style="font-weight:600; margin-left:6px;">${count}</span>
                                    </div>
                                `).join('')}
                                ${Object.keys(stats.statusCount).length === 0 ? '<span style="color:var(--gray-400);">暂无订单数据</span>' : ''}
                            </div>
                        </div>

                        <div class="table-wrapper">
                            <div class="table-header">
                                <h3>📋 最近订单</h3>
                                <span style="font-size:0.8rem; color:var(--gray-400);">共 ${orders.length} 条</span>
                            </div>
                            ${orders.length === 0 ? `
                                <div class="empty-state">
                                    <span class="empty-icon">📭</span>
                                    <p>暂无订单记录</p>
                                </div>
                            ` : `
                                <table>
                                    <thead>
                                        <tr>
                                            <th>订单号</th>
                                            <th>${isSupplier ? '客户' : '供应商'}</th>
                                            <th>产品项数</th>
                                            <th>总数量</th>
                                            <th>交期</th>
                                            <th>状态</th>
                                            <th>日期</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${orders.slice(0, 5).map(o => {
                                            const totalQty = o.items ? o.items.reduce((sum, item) => sum + item.quantity, 0) : 0;
                                            return `
                                            <tr>
                                                <td><strong>${o.id}</strong></td>
                                                <td>${isSupplier ? o.customer : o.supplier}</td>
                                                <td>${o.items ? o.items.length : 0}</td>
                                                <td>${totalQty}</td>
                                                <td>${o.deliveryDate || '-'}</td>
                                                <td><span class="badge ${getStatusBadge(o.status)}">${o.status}</span></td>
                                                <td>${o.date}</td>
                                                <td><button class="btn btn-outline btn-sm view-detail-btn" data-orderid="${o.id}">查看明细</button></td>
                                            </tr>
                                        `}).join('')}
                                    </tbody>
                                </table>
                            `}
                        </div>
                    </div>
                `;
            }

            // ---- 订单管理 ----
            else if (currentNav === 'orders') {
                if (isSupplier) {
                    // 标记已读
                    const allOrders = getOrders();
                    let changed = false;
                    allOrders.forEach(o => {
                        if (o.supplier === user.company && o.status === '待确认' && !o.read) {
                            o.read = true;
                            changed = true;
                        }
                    });
                    if (changed) setOrders(allOrders);
                }
                const freshOrders = getUserOrders(user);
                renderOrderTable(freshOrders, isSupplier);
                return;
            }

            // ---- 产品管理 / 下单采购 ----
            else if (currentNav === 'products') {
                if (isSupplier) {
                    html = `
                        <div class="fade-in">
                            <h1 class="page-title">📋 产品管理</h1>
                            <p class="page-subtitle">管理您供应的产品，支持上传Excel批量导入</p>
                            <div class="upload-area" id="uploadArea">
                                <span class="upload-icon">📤</span>
                                <div class="upload-text">
                                    <strong>点击上传 Excel 文件</strong><br />
                                    格式：第一列 <strong>物料编码</strong>，第二列 <strong>简称</strong>，第三列 <strong>产品全称</strong><br />
                                    示例：B-001 | 工业轴承 | 高精度滚动轴承
                                </div>
                                <input type="file" id="fileInput" accept=".xlsx,.xls" />
                            </div>
                            ${products.length === 0 ? `
                                <div class="empty-state">
                                    <span class="empty-icon">📦</span>
                                    <p>您还没有产品，请上传Excel</p>
                                </div>
                            ` : `
                                <div class="products-grid">
                                    ${products.map(p => `
                                        <div class="product-card">
                                            <div class="product-code">${p.code || ''}</div>
                                            <div class="product-short">${p.shortName || p.name}</div>
                                            <div class="product-full">${p.fullName || ''}</div>
                                            <div class="product-supplier">${p.supplier}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>
                    `;
                    mainContent.innerHTML = html;
                    const uploadArea = document.getElementById('uploadArea');
                    const fileInput = document.getElementById('fileInput');
                    if (uploadArea && fileInput) {
                        uploadArea.addEventListener('click', () => fileInput.click());
                        fileInput.addEventListener('change', handleFileUpload);
                    }
                } else {
                    // 客户下单
                    html = `
                        <div class="fade-in">
                            <h1 class="page-title">🛒 下单采购</h1>
                            <p class="page-subtitle">选择需要采购的产品，填写数量，统一交期（至少28天后）后提交订单</p>
                            ${products.length === 0 ? `
                                <div class="empty-state">
                                    <span class="empty-icon">📦</span>
                                    <p>暂无产品可采购</p>
                                </div>
                            ` : `
                                <form id="orderForm">
                                    <div class="order-table-wrap">
                                        <table>
                                            <thead>
                                                <tr>
                                                    <th>物料编码</th>
                                                    <th>简称</th>
                                                    <th>产品全称</th>
                                                    <th style="width:120px;">数量</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${products.map(p => `
                                                    <tr>
                                                        <td>${p.code}</td>
                                                        <td>${p.shortName}</td>
                                                        <td>${p.fullName}</td>
                                                        <td><input type="number" class="qty-input" data-code="${p.code}" data-short="${p.shortName}" data-full="${p.fullName}" min="0" value="0" step="1" /></td>
                                                    </tr>
                                                `).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="order-extra-fields">
                                        <div class="field-group">
                                            <label for="deliveryDate">交期 <span style="color:var(--danger);">*至少28天后</span></label>
                                            <input type="date" id="deliveryDate" value="${getMinDeliveryDate()}" min="${getMinDeliveryDate()}" />
                                        </div>
                                        <div class="field-group" style="flex:2;">
                                            <label for="orderNote">备注</label>
                                            <input type="text" id="orderNote" placeholder="特殊要求..." />
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary" style="width:100%;">提交订单</button>
                                </form>
                            `}
                        </div>
                    `;
                    mainContent.innerHTML = html;
                    if (products.length > 0) {
                        document.getElementById('orderForm').addEventListener('submit', function(e) {
                            e.preventDefault();
                            submitOrder(products);
                        });
                    }
                }
                return;
            }

            mainContent.innerHTML = html;
            // 绑定查看明细
            document.querySelectorAll('.view-detail-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const orderId = this.dataset.orderid;
                    const order = getOrders().find(o => o.id === orderId);
                    if (order) showOrderDetail(order);
                });
            });
        }

        // 订单管理表格（包含供应商操作）
        function renderOrderTable(orders, isSupplier) {
            let html = `
                <div class="fade-in">
                    <h1 class="page-title">📦 ${isSupplier ? '订单管理' : '我的订单'}</h1>
                    <p class="page-subtitle">${isSupplier ? '查看所有客户订单，可同意或拒绝' : '查看您的采购订单及供应商反馈'}</p>
                    <div class="table-wrapper">
                        <div class="table-header">
                            <h3>${isSupplier ? '全部订单' : '我的采购订单'}</h3>
                            <span style="font-size:0.8rem; color:var(--gray-400);">共 ${orders.length} 条</span>
                        </div>
                        ${orders.length === 0 ? `
                            <div class="empty-state">
                                <span class="empty-icon">📭</span>
                                <p>暂无订单</p>
                            </div>
                        ` : `
                            <table>
                                <thead>
                                    <tr>
                                        <th>订单号</th>
                                        <th>${isSupplier ? '客户' : '供应商'}</th>
                                        <th>产品项数</th>
                                        <th>总数量</th>
                                        <th>交期</th>
                                        <th>状态</th>
                                        <th>反馈</th>
                                        <th>日期</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${orders.map(o => {
                                        const totalQty = o.items ? o.items.reduce((sum, item) => sum + item.quantity, 0) : 0;
                                        const responseNote = o.responseNote || '';
                                        return `
                                        <tr>
                                            <td><strong>${o.id}</strong></td>
                                            <td>${isSupplier ? o.customer : o.supplier}</td>
                                            <td>${o.items ? o.items.length : 0}</td>
                                            <td>${totalQty}</td>
                                            <td>${o.deliveryDate || '-'}</td>
                                            <td><span class="badge ${getStatusBadge(o.status)}">${o.status}</span></td>
                                            <td style="max-width:120px; font-size:0.85rem;">${responseNote || '-'}</td>
                                            <td>${o.date}</td>
                                            <td>
                                                <div class="btn-group">
                                                    <button class="btn btn-outline btn-sm view-detail-btn" data-orderid="${o.id}">明细</button>
                                                    ${isSupplier && o.status === '待确认' ? `
                                                        <button class="btn btn-success btn-sm respond-btn" data-orderid="${o.id}" data-action="agree">同意</button>
                                                        <button class="btn btn-danger btn-sm respond-btn" data-orderid="${o.id}" data-action="reject">拒绝</button>
                                                    ` : ''}
                                                </div>
                                            </td>
                                        </tr>
                                    `}).join('')}
                                </tbody>
                            </table>
                        `}
                    </div>
                </div>
            `;
            mainContent.innerHTML = html;

            // 绑定查看明细
            document.querySelectorAll('.view-detail-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const orderId = this.dataset.orderid;
                    const order = getOrders().find(o => o.id === orderId);
                    if (order) showOrderDetail(order);
                });
            });

            // 供应商响应按钮
            document.querySelectorAll('.respond-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const orderId = this.dataset.orderid;
                    const action = this.dataset.action; // 'agree' or 'reject'
                    openResponseModal(orderId, action);
                });
            });
        }

        // ================================================================
        //  上传 Excel 处理 (供应商)
        // ================================================================

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const data = new Uint8Array(ev.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                    let products = [];
                    let startRow = 0;
                    if (json.length > 0 && json[0].some(cell =>
                            typeof cell === 'string' && /编码|简称|全称|名称|name/i.test(cell)
                        )) {
                        startRow = 1;
                    }
                    for (let i = startRow; i < json.length; i++) {
                        const row = json[i];
                        if (!row || row.length < 3) continue;
                        const code = String(row[0] || '').trim();
                        const shortName = String(row[1] || '').trim();
                        const fullName = String(row[2] || '').trim();
                        if (!code || !shortName || !fullName) continue;
                        products.push({
                            id: Date.now() + i,
                            code: code,
                            shortName: shortName,
                            fullName: fullName,
                            supplier: currentUser.company
                        });
                    }

                    if (products.length === 0) {
                        alert('未解析到有效产品数据，请确保格式：物料编码, 简称, 全称');
                        return;
                    }

                    let allProducts = getProducts();
                    allProducts = allProducts.filter(p => p.supplier !== currentUser.company);
                    allProducts = allProducts.concat(products);
                    setProducts(allProducts);

                    alert(`成功导入 ${products.length} 个产品！`);
                    renderMainContent(currentUser);
                    document.getElementById('fileInput').value = '';
                } catch (err) {
                    alert('解析Excel失败: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // ================================================================
        //  客户下单提交（校验交期>=28天）
        // ================================================================

        function submitOrder(products) {
            const items = [];
            document.querySelectorAll('.qty-input').forEach(input => {
                const qty = parseInt(input.value);
                if (qty > 0) {
                    items.push({
                        code: input.dataset.code,
                        shortName: input.dataset.short,
                        fullName: input.dataset.full,
                        quantity: qty
                    });
                }
            });
            if (items.length === 0) {
                alert('请至少选择一种产品并输入数量');
                return;
            }

            const deliveryDate = document.getElementById('deliveryDate').value;
            if (!deliveryDate) {
                alert('请选择交期');
                return;
            }
            // 校验至少28天
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const selectedDate = new Date(deliveryDate);
            selectedDate.setHours(0, 0, 0, 0);
            const diffDays = Math.ceil((selectedDate - today) / (1000 * 60 * 60 * 24));
            if (diffDays < 28) {
                alert('交期必须至少为28天后（含），请重新选择');
                return;
            }

            const note = document.getElementById('orderNote').value.trim();
            const supplierCompany = products.length > 0 ? products[0].supplier : '';
            const customerCompany = currentUser.company;

            const newOrder = addOrder(items, deliveryDate, note, customerCompany, supplierCompany);
            if (!newOrder) {
                alert('订单创建失败');
                return;
            }

            alert(`✅ 订单 ${newOrder.id} 已提交，等待供应商确认。`);
            currentNav = 'orders';
            renderSidebar(currentUser);
            renderMainContent(currentUser);
        }

        // ================================================================
        //  供应商反馈模态框
        // ================================================================

        function openResponseModal(orderId, action) {
            modalContainer.innerHTML = '';
            const actionText = action === 'agree' ? '同意' : '拒绝';
            const html = `
                <div class="modal-overlay" id="responseModalOverlay">
                    <div class="modal">
                        <h2>${actionText}订单</h2>
                        <div class="modal-sub">订单号: <strong>${orderId}</strong></div>
                        <div class="form-group">
                            <label for="responseNote">反馈备注 (可选)</label>
                            <textarea id="responseNote" rows="3" placeholder="请输入备注..."></textarea>
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-outline" id="cancelResponseBtn">取消</button>
                            <button class="btn ${action === 'agree' ? 'btn-success' : 'btn-danger'}" id="confirmResponseBtn">确认${actionText}</button>
                        </div>
                    </div>
                </div>
            `;
            modalContainer.innerHTML = html;

            const overlay = document.getElementById('responseModalOverlay');
            const cancelBtn = document.getElementById('cancelResponseBtn');
            const confirmBtn = document.getElementById('confirmResponseBtn');
            const noteInput = document.getElementById('responseNote');

            cancelBtn.addEventListener('click', () => { modalContainer.innerHTML = ''; });
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) modalContainer.innerHTML = '';
            });

            confirmBtn.addEventListener('click', () => {
                const note = noteInput.value.trim();
                const status = action === 'agree' ? '已同意' : '已拒绝';
                const success = respondOrder(orderId, status, note);
                if (success) {
                    alert(`订单 ${orderId} 已${actionText}。`);
                    modalContainer.innerHTML = '';
                    // 刷新订单列表
                    const freshOrders = getUserOrders(currentUser);
                    renderOrderTable(freshOrders, true);
                    // 同时更新侧边栏和总览状态（如通知数）
                    renderSidebar(currentUser);
                } else {
                    alert('处理失败，可能订单已不是待确认状态。');
                }
            });
        }

        // ================================================================
        //  查看订单明细（包含状态和反馈）
        // ================================================================

        function showOrderDetail(order) {
            modalContainer.innerHTML = '';
            const totalQty = order.items ? order.items.reduce((sum, item) => sum + item.quantity, 0) : 0;
            const html = `
                <div class="modal-overlay" id="detailModalOverlay">
                    <div class="modal">
                        <h2>📄 订单明细</h2>
                        <div class="modal-sub">
                            <strong>${order.id}</strong> | 客户: ${order.customer} | 供应商: ${order.supplier}<br/>
                            交期: ${order.deliveryDate || '-'} | 状态: <span class="badge ${getStatusBadge(order.status)}">${order.status}</span> | 日期: ${order.date}
                            ${order.responseNote ? `<br/>供应商反馈: ${order.responseNote}` : ''}
                            ${order.note ? `<br/>客户备注: ${order.note}` : ''}
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>物料编码</th>
                                    <th>简称</th>
                                    <th>产品全称</th>
                                    <th style="text-align:right;">数量</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${order.items ? order.items.map(item => `
                                    <tr>
                                        <td>${item.productCode || ''}</td>
                                        <td>${item.productShort || ''}</td>
                                        <td>${item.productFull || ''}</td>
                                        <td style="text-align:right;">${item.quantity}</td>
                                    </tr>
                                `).join('') : '<tr><td colspan="4">无明细</td></tr>'}
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="3" style="text-align:right; font-weight:600;">合计</td>
                                    <td style="text-align:right; font-weight:600;">${totalQty}</td>
                                </tr>
                            </tfoot>
                        </table>
                        <div class="form-actions">
                            <button class="btn btn-outline" id="closeDetailBtn">关闭</button>
                        </div>
                    </div>
                </div>
            `;
            modalContainer.innerHTML = html;

            const overlay = document.getElementById('detailModalOverlay');
            const closeBtn = document.getElementById('closeDetailBtn');
            closeBtn.addEventListener('click', () => { modalContainer.innerHTML = ''; });
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) modalContainer.innerHTML = '';
            });
        }

        // ================================================================
        //  登录 / 退出
        // ================================================================

        function handleLogin(username, password) {
            const user = USERS.find(u => u.username === username && u.password === password);
            if (!user) {
                loginError.textContent = '❌ 账号或密码错误，请重试';
                return false;
            }
            currentUser = user;
            loginError.textContent = '';
            loginPage.classList.add('hidden');
            dashboardPage.classList.remove('hidden');
            currentNav = 'overview';
            renderDashboard(user);
            return true;
        }

        function handleLogout() {
            currentUser = null;
            currentNav = 'overview';
            dashboardPage.classList.add('hidden');
            loginPage.classList.remove('hidden');
            usernameInput.value = 'supplier1';
            passwordInput.value = '123456';
            loginError.textContent = '';
            modalContainer.innerHTML = '';
        }

        function renderDashboard(user) {
            roleBadge.textContent = user.role === 'supplier' ? '供应商' : '客户';
            roleBadge.className = `role-badge role-badge-${user.role}`;
            userDisplayName.textContent = user.name;
            userCompany.textContent = user.company;
            userAvatar.textContent = user.avatar || user.name.charAt(0);

            renderSidebar(user);
            renderMainContent(user);
        }

        // ================================================================
        //  事件绑定
        // ================================================================

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            if (!username || !password) {
                loginError.textContent = '⚠️ 请输入账号和密码';
                return;
            }
            handleLogin(username, password);
        });

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit'));
        });

        logoutBtn.addEventListener('click', handleLogout);

        document.querySelectorAll('.account-item').forEach(item => {
            item.addEventListener('click', () => {
                usernameInput.value = item.dataset.username;
                passwordInput.value = item.dataset.password;
                loginError.textContent = '';
                handleLogin(item.dataset.username, item.dataset.password);
            });
        });

        // ================================================================
        //  启动
        // ================================================================

        loginPage.classList.remove('hidden');
        dashboardPage.classList.add('hidden');
        usernameInput.value = 'supplier1';
        passwordInput.value = '123456';

        console.log('🔐 供应链协同平台已启动 (订单确认/反馈，交期≥28天)');
        console.log('📋 测试账号: supplier1 / 123456 (供应商)');
        console.log('📋 测试账号: customer1 / 123456 (客户)');
        console.log('💡 客户下单交期至少28天后，供应商可同意/拒绝并备注反馈');
    </script>
</body>
</html>

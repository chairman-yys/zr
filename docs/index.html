<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>供应链协同平台</title>
    <!-- Supabase UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js">
    </script>
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <style>
        /* ===== 完整样式 ===== */
        :root {
            --primary: #4F46E5;
            --primary-light: #818CF8;
            --primary-dark: #3730A3;
            --primary-gradient: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --gray-50: #F8FAFC;
            --gray-100: #F1F5F9;
            --gray-200: #E2E8F0;
            --gray-300: #CBD5E1;
            --gray-400: #94A3B8;
            --gray-500: #64748B;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1E293B;
            --gray-900: #0F172A;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== 简约配色（只改颜色、边框、圆角、阴影，不动布局） ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f5f6fa;
    color: #1e293b;
    min-height: 100vh;
}

.hidden {
    display: none !important;
}

/* 按钮 */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 20px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    background: #fff;
    color: #1e293b;
    gap: 6px;
}
.btn:hover {
    background: #f1f3f5;
}
.btn-primary {
    background: #1e293b;
    color: #fff;
    border-color: #1e293b;
}
.btn-primary:hover {
    background: #334155;
    border-color: #334155;
}
.btn-success {
    background: #0b7e3d;
    color: #fff;
    border-color: #0b7e3d;
}
.btn-success:hover {
    background: #0a6a33;
    border-color: #0a6a33;
}
.btn-danger {
    background: #b91c1c;
    color: #fff;
    border-color: #b91c1c;
}
.btn-danger:hover {
    background: #991b1b;
    border-color: #991b1b;
}
.btn-sm {
    padding: 4px 12px;
    font-size: 0.8rem;
}
.btn-outline {
    background: transparent;
    border-color: #d1d5db;
}
.btn-outline:hover {
    background: #f1f3f5;
}

/* 徽章 */
.badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 500;
    background: #e2e8f0;
    color: #475569;
}
.badge-success {
    background: #d1fae5;
    color: #065f46;
}
.badge-warning {
    background: #fef3c7;
    color: #92400e;
}
.badge-danger {
    background: #fee2e2;
    color: #991b1b;
}
.badge-info {
    background: #dbeafe;
    color: #1e40af;
}

/* 卡片 */
.card {
    background: #fff;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    padding: 20px 24px;
}

/* 空状态 */
.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #94a3b8;
}

/* ===== 登录页 ===== */
#loginPage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #f5f6fa;
}
.login-container {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    padding: 40px 36px;
}
.login-container h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 6px;
}
.login-container .subtitle {
    color: #64748b;
    font-size: 0.9rem;
    margin-bottom: 28px;
}
.form-group {
    margin-bottom: 16px;
}
.form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 4px;
    color: #334155;
}
.form-group input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 0.95rem;
    transition: border-color 0.2s;
    background: #fff;
}
.form-group input:focus {
    outline: none;
    border-color: #1e293b;
}
.login-btn {
    width: 100%;
    padding: 10px;
    font-size: 1rem;
    margin-top: 6px;
}
.error-msg {
    color: #b91c1c;
    font-size: 0.85rem;
    margin-top: 10px;
    min-height: 24px;
}
.test-accounts {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #e2e8f0;
}
.test-accounts p {
    font-size: 0.8rem;
    color: #94a3b8;
    margin-bottom: 8px;
}
.accounts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}
.account-item {
    background: #f8fafc;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-family: monospace;
    border: 1px solid #e2e8f0;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s;
}
.account-item:hover {
    background: #e2e8f0;
}
.account-item .role-tag {
    font-size: 0.6rem;
    padding: 1px 8px;
    border-radius: 10px;
    margin-left: 4px;
    font-family: sans-serif;
}
.role-tag-supplier {
    background: #dbeafe;
    color: #1e40af;
}
.role-tag-customer {
    background: #d1fae5;
    color: #065f46;
}
.login-brand {
    text-align: center;
    margin-bottom: 24px;
}
.login-brand .name {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.5px;
}
.login-brand .name span {
    color: #1e293b;
}

/* ===== 仪表板 ===== */
#dashboardPage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #f5f6fa;
}
.topbar {
    background: #fff;
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #e2e8f0;
    flex-shrink: 0;
}
.topbar .left {
    display: flex;
    align-items: center;
    gap: 16px;
}
.topbar .brand {
    font-size: 1.1rem;
    font-weight: 700;
}
.topbar .brand .highlight {
    color: #1e293b;
}
.topbar .role-badge {
    font-size: 0.7rem;
    padding: 2px 12px;
    border-radius: 12px;
    font-weight: 500;
    background: #e2e8f0;
    color: #475569;
}
.role-badge-supplier {
    background: #dbeafe;
    color: #1e40af;
}
.role-badge-customer {
    background: #d1fae5;
    color: #065f46;
}
.topbar .right {
    display: flex;
    align-items: center;
    gap: 14px;
}
.topbar .user-info {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
}
.topbar .user-info .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #1e293b;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 0.8rem;
}
.topbar .user-info .name {
    font-weight: 500;
}
.topbar .user-info .company {
    color: #94a3b8;
    font-size: 0.8rem;
}

.dashboard-body {
    display: flex;
    flex: 1;
    min-height: 0;
}

/* 侧边栏 */
.sidebar {
    width: 180px;
    background: #fff;
    border-right: 1px solid #e2e8f0;
    padding: 16px 0;
    flex-shrink: 0;
    overflow-y: auto;
}
.sidebar .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 20px;
    margin: 2px 10px;
    border-radius: 6px;
    color: #64748b;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    border: none;
    background: transparent;
    width: calc(100% - 20px);
}
.sidebar .nav-item:hover {
    background: #f1f3f5;
    color: #1e293b;
}
.sidebar .nav-item.active {
    background: #1e293b;
    color: #fff;
}
.sidebar .nav-item .notification-dot {
    background: #b91c1c;
    color: #fff;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 0.65rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: auto;
}
.sidebar .nav-section {
    padding: 8px 20px 4px;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #94a3b8;
    font-weight: 600;
}

/* 主内容 */
.main-content {
    flex: 1;
    padding: 20px 28px;
    overflow-y: auto;
    background: #f5f6fa;
}
.main-content .page-title {
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 4px;
}
.main-content .page-subtitle {
    color: #94a3b8;
    font-size: 0.9rem;
    margin-bottom: 20px;
}

/* 统计卡片 */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}
.stat-card {
    background: #fff;
    padding: 16px 20px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
}
.stat-card .stat-label {
    font-size: 0.75rem;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    font-weight: 500;
}
.stat-card .stat-value {
    font-size: 1.6rem;
    font-weight: 600;
    margin-top: 2px;
}

/* 表格 */
.table-wrapper {
    background: #fff;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    overflow: hidden;
}
.table-wrapper .table-header {
    padding: 12px 20px;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}
.table-wrapper .table-header h3 {
    font-size: 0.95rem;
    font-weight: 600;
}
.table-wrapper table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
}
.table-wrapper table th {
    text-align: left;
    padding: 10px 16px;
    background: #f8fafc;
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: #64748b;
    border-bottom: 1px solid #e2e8f0;
}
.table-wrapper table td {
    padding: 10px 16px;
    border-bottom: 1px solid #f1f3f5;
    color: #334155;
}
.table-wrapper table tr:last-child td {
    border-bottom: none;
}
.table-wrapper table tr:hover td {
    background: #f8fafc;
}

/* 产品网格 */
.products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    margin-top: 12px;
}
.product-card {
    background: #fff;
    border-radius: 8px;
    padding: 16px;
    border: 1px solid #e2e8f0;
    text-align: center;
    transition: border-color 0.2s;
}
.product-card:hover {
    border-color: #94a3b8;
}
.product-card .product-code {
    font-size: 0.75rem;
    color: #94a3b8;
    font-family: monospace;
}
.product-card .product-short {
    font-weight: 600;
    font-size: 1rem;
    margin: 4px 0 2px;
}
.product-card .product-full {
    font-size: 0.8rem;
    color: #64748b;
    margin-bottom: 4px;
}
.product-card .product-supplier {
    font-size: 0.7rem;
    color: #94a3b8;
}

/* 模态框 */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
}
.modal {
    background: #fff;
    border-radius: 8px;
    max-width: 560px;
    width: 100%;
    padding: 28px 32px;
    max-height: 90vh;
    overflow-y: auto;
}
.modal h2 {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 4px;
}
.modal .modal-sub {
    color: #64748b;
    font-size: 0.9rem;
    margin-bottom: 16px;
}
.modal .form-group {
    margin-bottom: 14px;
}
.modal .form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 4px;
    color: #334155;
}
.modal .form-group input,
.modal .form-group textarea,
.modal .form-group select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 0.9rem;
    background: #fff;
    font-family: inherit;
}
.modal .form-group input:focus,
.modal .form-group textarea:focus,
.modal .form-group select:focus {
    outline: none;
    border-color: #1e293b;
}
.modal .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    justify-content: flex-end;
}
.modal .form-actions .btn {
    flex: 1;
}
.modal table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 0.9rem;
}
.modal table th {
    text-align: left;
    padding: 6px 8px;
    background: #f8fafc;
    font-weight: 600;
    font-size: 0.75rem;
    border-bottom: 1px solid #e2e8f0;
}
.modal table td {
    padding: 6px 8px;
    border-bottom: 1px solid #f1f3f5;
}
.modal table tr:last-child td {
    border-bottom: none;
}

/* 上传区域 */
.upload-area {
    border: 2px dashed #d1d5db;
    border-radius: 6px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: #fafafa;
    margin: 12px 0 16px;
}
.upload-area:hover {
    border-color: #1e293b;
    background: #f8fafc;
}
.upload-area input[type="file"] {
    display: none;
}
.upload-area .upload-text {
    color: #64748b;
    font-size: 0.9rem;
}

/* 下单表格 */
.order-table-wrap {
    overflow-x: auto;
}
.order-table-wrap table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #e2e8f0;
    font-size: 0.9rem;
}
.order-table-wrap table th {
    background: #f8fafc;
    padding: 8px 14px;
    text-align: left;
    font-weight: 600;
    font-size: 0.75rem;
    border-bottom: 1px solid #e2e8f0;
}
.order-table-wrap table td {
    padding: 6px 14px;
    border-bottom: 1px solid #f1f3f5;
}
.order-table-wrap table tr:hover td {
    background: #f8fafc;
}
.order-table-wrap input[type="number"] {
    width: 70px;
    padding: 4px 8px;
    border: 1px solid #d1d5db;
    border-radius: 4px;
    font-size: 0.9rem;
}
.order-table-wrap input[type="number"]:focus {
    outline: none;
    border-color: #1e293b;
}

.order-extra-fields {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin: 16px 0;
    padding: 14px 16px;
    background: #fff;
    border-radius: 6px;
    border: 1px solid #e2e8f0;
}
.order-extra-fields .field-group {
    flex: 1 1 180px;
}
.order-extra-fields .field-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 500;
    color: #334155;
    margin-bottom: 4px;
}
.order-extra-fields .field-group input {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid #d1d5db;
    border-radius: 4px;
    font-size: 0.9rem;
}
.order-extra-fields .field-group input:focus {
    outline: none;
    border-color: #1e293b;
}

.table-header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

/* 响应式 */
@media (max-width: 768px) {
    .login-container {
        padding: 28px 20px;
        max-width: 100%;
    }
    .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #e2e8f0;
        padding: 8px 0;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: center;
        background: #fff;
        position: sticky;
        top: 56px;
        z-index: 10;
    }
    .sidebar .nav-item {
        padding: 6px 14px;
        margin: 2px 4px;
        width: auto;
        font-size: 0.8rem;
    }
    .sidebar .nav-section {
        display: none;
    }
    .dashboard-body {
        flex-direction: column;
    }
    .main-content {
        padding: 16px;
    }
    .topbar {
        padding: 0 16px;
        flex-wrap: wrap;
        height: auto;
        min-height: 52px;
        gap: 6px;
    }
    .topbar .user-info .company {
        display: none;
    }
    .stats-grid {
        grid-template-columns: 1fr 1fr;
    }
    .products-grid {
        grid-template-columns: 1fr 1fr;
    }
    .table-wrapper {
        overflow-x: auto;
    }
    .table-wrapper table {
        font-size: 0.8rem;
        min-width: 500px;
    }
    .modal {
        margin: 16px;
        padding: 20px;
        max-width: 100%;
    }
    .accounts-grid {
        grid-template-columns: 1fr;
    }
}
@media (max-width: 480px) {
    .stats-grid {
        grid-template-columns: 1fr;
    }
    .products-grid {
        grid-template-columns: 1fr;
    }
}

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--gray-100);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gray-400);
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- 登录页面 -->
    <!-- ============================================================ -->
    <div id="loginPage">
        <div class="login-container">
            <div class="login-left">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
                        <path d="M12 2L2 7l10 5 10-5-10-5z" />
                        <path d="M2 17l10 5 10-5" />
                        <path d="M2 12l10 5 10-5" />
                    </svg>
                    <span>协同<span class="highlight">链</span></span>
                </div>
                <h1>欢迎回来</h1>
                <p class="subtitle">登录您的账号以访问供应链协同平台</p>
                <form id="loginForm" autocomplete="off">
                    <div class="form-group">
                        <label for="username">账号</label>
                        <input type="text" id="username" placeholder="请输入账号" value="supplier1" />
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" placeholder="请输入密码" value="123456" />
                    </div>
                    <button type="submit" class="btn btn-primary login-btn">登 录</button>
                    <div class="error-msg" id="loginError"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- 仪表板页面 -->
    <!-- ============================================================ -->
    <div id="dashboardPage" class="hidden">
        <header class="topbar">
            <div class="left">
                <div class="brand">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary); width:28px; height:28px;">
                        <path d="M12 2L2 7l10 5 10-5-10-5z" />

        async function exportOrders(orders) {
            if (!orders || orders.length === 0) { alert('无订单可导出'); return; }
            const rows = [
                ['物料编码', '产品名称', '下单数量', '交付时间', '是否同意接单']
            ];
            orders.forEach(o => {
                const statusText = o.status === '已同意' ? '同意' : o.status === '已拒绝' ? '拒绝' : o.status;
                if (o.items && o.items.length > 0) {
                    o.items.forEach(item => {
                        rows.push([
                            item.productCode || '',
                            item.productFull || item.productShort || '',
                            item.quantity || 0,
                            o.delivery_date || '',
                            statusText
                        ]);
                    });
                } else {
                    rows.push(['', '', '', o.delivery_date || '', statusText]);
                }
            });
            const csv = '\uFEFF' + rows.map(row => row.join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `订单_${currentUser.company}_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        // ============================================================
        // 上传Excel
        // ============================================================
        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(ev) {
                try {
                    const workbook = XLSX.read(ev.target.result, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                    console.log('📄 原始JSON:', json);  // ✅ 打印原始数据
                    
                    let products = [];
                    let start = 0;
                    if (json.length > 0 && json[0].some(c => /编码|简称|全称/i.test(c))) start = 1;
                    for (let i = start; i < json.length; i++) {
                        const row = json[i];
                        if (!row || row.length < 3) continue;
                        const code = String(row[0] || '').trim();
                        const shortName = String(row[1] || '').trim();
                        const fullName = String(row[2] || '').trim();
                        if (!code || !shortName || !fullName) continue;
                        products.push({ code, shortName, fullName });
                    }
                    console.log('📦 解析出的产品:', products);  // ✅ 打印解析结果

                    if (products.length === 0) { alert('未解析到有效数据'); return; }
                    const map = new Map();
                    products.forEach(p => map.set(p.code, p));
                    const unique = Array.from(map.values());
                    await replaceProductsForSupplier(currentUser.company, unique);
                    console.log('✅ 保存成功');
                    
                    alert(`导入 ${unique.length} 个产品`);
                    await renderMainContent(currentUser);
                    document.getElementById('fileInput').value = '';
                } catch (err) {
                    alert('解析失败: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // ============================================================
        // 客户下单
        // ============================================================
        async function submitOrder(products) {
            const items = [];
            document.querySelectorAll('.qty-input').forEach(input => {
                const qty = parseInt(input.value);
                if (qty > 0) {
                    items.push({
                        code: input.dataset.code,
                        shortName: input.dataset.short,
                        fullName: input.dataset.full,
                        quantity: qty
                    });
                }
            });
            if (items.length === 0) { alert('请至少选择一种产品'); return; }
            const delivery = document.getElementById('deliveryDate').value;
            if (!delivery) { alert('请选择交期'); return; }
            const diff = Math.ceil((new Date(delivery) - new Date()) / (1000 * 60 * 60 * 24));
            if (diff < 28) { alert('交期需≥28天'); return; }
            const note = document.getElementById('orderNote').value.trim();
            const supplier = products[0].supplier;
            const customer = currentUser.company;
            try {
                const newOrder = await addOrder(items, delivery, note, customer, supplier);
                if (newOrder) {
                    alert(`订单 ${newOrder.id} 已提交`);
                    currentNav = 'orders';
                    await renderSidebar(currentUser);
                    await renderMainContent(currentUser);
                }
            } catch (err) {
                alert('提交失败: ' + err.message);
            }
        }

        // ============================================================
        // 查看订单明细
        // ============================================================
        function showOrderDetail(order) {
            modalContainer.innerHTML = `
                <div class="modal-overlay" id="detailModalOverlay">
                    <div class="modal">
                        <h2>📄 订单明细</h2>
                        <p><strong>${order.id}</strong> | 客户: ${order.customer} | 供应商: ${order.supplier}</p>
                        <p>交期: ${order.delivery_date || '-'} | 状态: <span class="badge ${getStatusBadge(order.status)}">${order.status}</span></p>
                        ${order.response_note ? `<p>供应商反馈: ${order.response_note}</p>` : ''}
                        ${order.note ? `<p>客户备注: ${order.note}</p>` : ''}
                        <table>
                            <thead><tr><th>编码</th><th>简称</th><th>全称</th><th>数量</th></tr></thead>
                            <tbody>
                                ${order.items ? order.items.map(item => `
                                    <tr><td>${item.productCode||''}</td><td>${item.productShort||''}</td><td>${item.productFull||''}</td><td>${item.quantity}</td></tr>
                                `).join('') : '<tr><td colspan="4">无明细</td></tr>'}
                            </tbody>
                        </table>
                        <div class="form-actions"><button class="btn btn-outline" id="closeDetailBtn">关闭</button></div>
                    </div>
                </div>
            `;
            document.getElementById('closeDetailBtn').addEventListener('click', () => modalContainer.innerHTML = '');
            document.getElementById('detailModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) modalContainer.innerHTML = '';
            });
        }

        // ============================================================
        // 供应商反馈模态框
        // ============================================================
        function openResponseModal(orderId, action) {
            modalContainer.innerHTML = `
                <div class="modal-overlay" id="responseModalOverlay">
                    <div class="modal">
                        <h2>${action === 'agree' ? '同意' : '拒绝'}订单</h2>
                        <div class="form-group">
                            <label>备注</label>
                            <textarea id="responseNote" rows="3"></textarea>
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-outline" id="cancelResponseBtn">取消</button>
                            <button class="btn ${action === 'agree' ? 'btn-success' : 'btn-danger'}" id="confirmResponseBtn">确认</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('cancelResponseBtn').addEventListener('click', () => modalContainer.innerHTML = '');
            document.getElementById('confirmResponseBtn').addEventListener('click', async function() {
                const note = document.getElementById('responseNote').value.trim();
                const status = action === 'agree' ? '已同意' : '已拒绝';
                try {
                    await respondOrder(orderId, status, note);
                    alert(`订单已${status}`);
                    modalContainer.innerHTML = '';
                    await renderSidebar(currentUser);
                    await renderMainContent(currentUser);
                } catch (err) {
                    alert('操作失败: ' + err.message);
                }
            });
            document.getElementById('responseModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) modalContainer.innerHTML = '';
            });
        }

        // ============================================================
        // 客户编辑订单（修改数量）
        // ============================================================
        function openEditOrderModal(order) {
            let items = order.items.map(item => ({ ...item }));
            const modalHtml = `
                <div class="modal-overlay" id="editModalOverlay">
                    <div class="modal" style="max-width:700px;">
                        <h2>✏️ 编辑订单 ${order.id}</h2>
                        <p>修改产品数量（型号不可改），保存后更新</p>
                        <table>
                            <thead><tr><th>编码</th><th>产品名称</th><th>数量</th></tr></thead>
                            <tbody id="editItemsBody">
                                ${items.map((item, idx) => `
                                    <tr>
                                        <td>${item.productCode}</td>
                                        <td>${item.productFull || item.productShort}</td>
                                        <td><input type="number" class="edit-qty" data-index="${idx}" value="${item.quantity}" min="0" step="1" /></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                        <div class="form-group">
                            <label>交期</label>
                            <input type="date" id="editDeliveryDate" value="${order.delivery_date || ''}" min="${getMinDeliveryDate()}" />
                        </div>
                        <div class="form-group">
                            <label>备注</label>
                            <input type="text" id="editNote" value="${order.note || ''}" />
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-outline" id="cancelEditBtn">取消</button>
                            <button class="btn btn-primary" id="saveEditBtn">保存修改</button>
                        </div>
                    </div>
                </div>
            `;
            modalContainer.innerHTML = modalHtml;

            document.getElementById('saveEditBtn').addEventListener('click', async function() {
                const inputs = document.querySelectorAll('.edit-qty');
                const newItems = [];
                inputs.forEach(input => {
                    const idx = parseInt(input.dataset.index);
                    const qty = parseInt(input.value);
                    if (qty > 0) {
                        const original = items[idx];
                        newItems.push({
                            productCode: original.productCode,
                            productShort: original.productShort,
                            productFull: original.productFull,
                            quantity: qty
                        });
                    }
                });
                if (newItems.length === 0) {
                    alert('至少保留一种产品数量大于0');
                    return;
                }
                const delivery = document.getElementById('editDeliveryDate').value;
                if (!delivery) { alert('请选择交期'); return; }
                const diff = Math.ceil((new Date(delivery) - new Date()) / (1000 * 60 * 60 * 24));
                if (diff < 28) { alert('交期需≥28天'); return; }
                const note = document.getElementById('editNote').value.trim();
                try {
                    await updateOrder(order.id, newItems, delivery, note);
                    alert('订单已更新');
                    modalContainer.innerHTML = '';
                    await renderSidebar(currentUser);
                    await renderMainContent(currentUser);
                } catch (err) {
                    alert('更新失败: ' + err.message);
                }
            });

            document.getElementById('cancelEditBtn').addEventListener('click', () => modalContainer.innerHTML = '');
            document.getElementById('editModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) modalContainer.innerHTML = '';
            });
        }

        // ============================================================
        // 登录/退出
        // ============================================================
        async function handleLogin(username, password) {
            loginError.textContent = '';
            const user = USERS.find(u => u.username === username && u.password === password);
            if (!user) {
                loginError.textContent = '❌ 账号或密码错误';
                return;
            }
            currentUser = user;
            loginPage.classList.add('hidden');
            dashboardPage.classList.remove('hidden');
            currentNav = 'overview';
            await renderDashboard(user);
        }

        function handleLogout() {
            currentUser = null;
            dashboardPage.classList.add('hidden');
            loginPage.classList.remove('hidden');
            usernameInput.value = 'supplier1';
            passwordInput.value = '123456';
            loginError.textContent = '';
            modalContainer.innerHTML = '';
        }

        async function renderDashboard(user) {
            roleBadge.textContent = user.role === 'supplier' ? '供应商' : '客户';
            roleBadge.className = `role-badge role-badge-${user.role}`;
            userDisplayName.textContent = user.name;
            userCompany.textContent = user.company;
            userAvatar.textContent = user.name.charAt(0);
            await renderSidebar(user);
            await renderMainContent(user);
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            if (!username || !password) {
                loginError.textContent = '⚠️ 请输入账号和密码';
                return;
            }
            handleLogin(username, password);
        });

        logoutBtn.addEventListener('click', handleLogout);

        // 测试账号点击只填充，不自动登录
        document.querySelectorAll('.account-item').forEach(item => {
            item.addEventListener('click', function() {
                usernameInput.value = this.dataset.username;
                passwordInput.value = this.dataset.password;
                loginError.textContent = '';
            });
        });

        // ============================================================
        // 启动
        // ============================================================
        loginPage.classList.remove('hidden');
        dashboardPage.classList.add('hidden');
        usernameInput.value = 'supplier1';
        passwordInput.value = '123456';
        console.log('✅ 系统已启动，Supabase 客户端已创建');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>供应链协同平台</title>
    <!-- Supabase UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js">
    </script>
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <style>
        /* ===== 完整样式 ===== */
        :root {
            --primary: #4F46E5;
            --primary-light: #818CF8;
            --primary-dark: #3730A3;
            --primary-gradient: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --gray-50: #F8FAFC;
            --gray-100: #F1F5F9;
            --gray-200: #E2E8F0;
            --gray-300: #CBD5E1;
            --gray-400: #94A3B8;
            --gray-500: #64748B;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1E293B;
            --gray-900: #0F172A;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--gray-100);
            color: var(--gray-800);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gray-900);
            background-image: radial-gradient(ellipse at 20% 50%, rgba(79, 70, 229, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(124, 58, 237, 0.15) 0%, transparent 60%);
        }

        .hidden {
            display: none !important;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            gap: 8px;
        }
        .btn-primary {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.45);
        }
        .btn-success {
            background: #10B981;
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #EF4444;
            color: #fff;
        }
        .btn-danger:hover {
            background: #DC2626;
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            color: var(--gray-600);
            border: 1.5px solid var(--gray-300);
        }
        .btn-outline:hover {
            background: var(--gray-100);
            border-color: var(--gray-400);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-success {
            background: #D1FAE5;
            color: #065F46;
        }
        .badge-warning {
            background: #FEF3C7;
            color: #92400E;
        }
        .badge-danger {
            background: #FEE2E2;
            color: #991B1B;
        }
        .badge-info {
            background: #DBEAFE;
            color: #1E40AF;
        }
        .badge-secondary {
            background: #E5E7EB;
            color: #4B5563;
        }
        .badge-notification {
            background: #EF4444;
            color: #fff;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        /* ===== 登录页面 ===== */
        #loginPage {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            min-height: 540px;
        }
        .login-left {
            flex: 1;
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
        }
        .login-left .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .login-left .logo svg {
            width: 36px;
            height: 36px;
        }
        .login-left .logo span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
        }
        .login-left .logo span .highlight {
            color: var(--primary);
        }
        .login-left h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-top: 16px;
            margin-bottom: 8px;
        }
        .login-left .subtitle {
            color: var(--gray-500);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }
        .login-left .form-group {
            margin-bottom: 20px;
        }
        .login-left .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 6px;
        }
        .login-left .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            transition: var(--transition);
            background: var(--gray-50);
        }
        .login-left .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            background: #fff;
        }
        .login-left .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            margin-top: 8px;
        }
        .login-left .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 12px;
            min-height: 24px;
            text-align: center;
        }
        .login-left .test-accounts {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--gray-200);
        }
        .login-left .test-accounts p {
            font-size: 0.8rem;
            color: var(--gray-500);
            margin-bottom: 8px;
        }
        .login-left .test-accounts .accounts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .login-left .test-accounts .account-item {
            background: var(--gray-50);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: monospace;
            color: var(--gray-600);
            border: 1px solid var(--gray-200);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }
        .login-left .test-accounts .account-item:hover {
            background: var(--gray-100);
            border-color: var(--primary);
        }
        .login-left .test-accounts .account-item .role-tag {
            display: inline-block;
            font-size: 0.6rem;
            padding: 1px 8px;
            border-radius: 999px;
            margin-left: 4px;
        }
        .role-tag-supplier {
            background: #DBEAFE;
            color: #1E40AF;
        }
        .role-tag-customer {
            background: #D1FAE5;
            color: #065F46;
        }
        .login-right {
            flex: 1;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 40px;
            color: #fff;
            flex-direction: column;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .login-right::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
            animation: rotateBg 30s linear infinite;
        }
        @keyframes rotateBg {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .login-right .content {
            position: relative;
            z-index: 1;
        }
        .login-right .icon-big {
            font-size: 4.5rem;
            margin-bottom: 16px;
            display: block;
        }
        .login-right h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .login-right p {
            opacity: 0.85;
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 340px;
        }
        .login-right .features {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
            max-width: 300px;
        }
        .login-right .features .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .login-right .features .feature-item span {
            font-size: 1.2rem;
        }

        /* ===== 仪表板 ===== */
        #dashboardPage {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--gray-100);
        }

        .topbar {
            background: #fff;
            padding: 0 32px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--gray-200);
        }
        .topbar .left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .topbar .left .brand {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gray-900);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topbar .left .brand svg {
            width: 28px;
            height: 28px;
        }
        .topbar .left .brand .highlight {
            color: var(--primary);
        }
        .topbar .left .role-badge {
            font-size: 0.7rem;
            padding: 4px 14px;
            border-radius: 999px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .role-badge-supplier {
            background: #DBEAFE;
            color: #1E40AF;
        }
        .role-badge-customer {
            background: #D1FAE5;
            color: #065F46;
        }
        .topbar .right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .topbar .right .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }
        .topbar .right .user-info .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .topbar .right .user-info .name {
            font-weight: 600;
            color: var(--gray-800);
        }
        .topbar .right .user-info .company {
            color: var(--gray-500);
            font-size: 0.8rem;
        }

        .dashboard-body {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .sidebar {
            width: 220px;
            background: #fff;
            border-right: 1px solid var(--gray-200);
            padding: 20px 0;
            flex-shrink: 0;
            overflow-y: auto;
        }
        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 24px;
            margin: 2px 12px;
            border-radius: var(--radius-sm);
            color: var(--gray-600);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            border: none;
            background: transparent;
            width: calc(100% - 24px);
            position: relative;
        }
        .sidebar .nav-item:hover {
            background: var(--gray-100);
            color: var(--gray-800);
        }
        .sidebar .nav-item.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .sidebar .nav-item .icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar .nav-item .notification-dot {
            background: #EF4444;
            color: #fff;
            border-radius: 999px;
            padding: 0 8px;
            font-size: 0.65rem;
            font-weight: 700;
            line-height: 18px;
            margin-left: auto;
            animation: pulse 1.5s infinite;
        }
        .sidebar .nav-section {
            padding: 16px 24px 8px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--gray-400);
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            padding: 24px 32px 32px;
            overflow-y: auto;
            background: var(--gray-50);
        }
        .main-content .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 6px;
        }
        .main-content .page-subtitle {
            color: var(--gray-500);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: #fff;
            padding: 20px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-200);
            transition: var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .stat-card .stat-label {
            font-size: 0.8rem;
            color: var(--gray-500);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-top: 4px;
        }

        .table-wrapper {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .table-wrapper .table-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .table-wrapper .table-header h3 {
            font-size: 1rem;
            font-weight: 600;
        }
        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .table-wrapper table th {
            text-align: left;
            padding: 12px 20px;
            background: var(--gray-50);
            font-weight: 600;
            color: var(--gray-600);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--gray-200);
        }
        .table-wrapper table td {
            padding: 12px 20px;
            border-bottom: 1px solid var(--gray-100);
            color: var(--gray-700);
        }
        .table-wrapper table tr:last-child td {
            border-bottom: none;
        }
        .table-wrapper table tr:hover td {
            background: var(--gray-50);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .product-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--gray-200);
            text-align: center;
            transition: var(--transition);
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
        }
        .product-card .product-code {
            font-size: 0.8rem;
            color: var(--gray-500);
            font-family: monospace;
        }
        .product-card .product-short {
            font-weight: 600;
            font-size: 1.1rem;
            margin: 4px 0;
        }
        .product-card .product-full {
            font-size: 0.85rem;
            color: var(--gray-600);
            margin-bottom: 4px;
        }
        .product-card .product-supplier {
            font-size: 0.7rem;
            color: var(--gray-400);
            margin-top: 4px;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .modal {
            background: #fff;
            border-radius: var(--radius);
            max-width: 600px;
            width: 100%;
            padding: 32px;
            box-shadow: var(--shadow-xl);
            animation: fadeIn 0.25s ease-out;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .modal .modal-sub {
            color: var(--gray-500);
            margin-bottom: 20px;
        }
        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 4px;
        }
        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            transition: var(--transition);
            background: var(--gray-50);
            font-family: inherit;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            background: #fff;
        }
        .modal .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .modal .form-actions .btn {
            flex: 1;
        }
        .modal table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        .modal table th {
            text-align: left;
            padding: 6px 8px;
            background: var(--gray-50);
            font-weight: 600;
            font-size: 0.8rem;
            border-bottom: 1px solid var(--gray-200);
        }
        .modal table td {
            padding: 6px 8px;
            border-bottom: 1px solid var(--gray-100);
            font-size: 0.9rem;
        }
        .modal table tr:last-child td {
            border-bottom: none;
        }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed var(--gray-300);
            border-radius: var(--radius-sm);
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--gray-50);
            margin: 16px 0;
        }
        .upload-area:hover {
            border-color: var(--primary);
            background: #EEF2FF;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .upload-area .upload-icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 8px;
        }
        .upload-area .upload-text {
            color: var(--gray-500);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray-500);
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
        }

        .fade-in {
            animation: fadeIn 0.35s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 下单表格 */
        .order-table-wrap {
            overflow-x: auto;
        }
        .order-table-wrap table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .order-table-wrap table th {
            background: var(--gray-50);
            padding: 10px 14px;
            text-align: left;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gray-600);
            border-bottom: 1px solid var(--gray-200);
        }
        .order-table-wrap table td {
            padding: 8px 14px;
            border-bottom: 1px solid var(--gray-100);
            vertical-align: middle;
        }
        .order-table-wrap table tr:hover td {
            background: var(--gray-50);
        }
        .order-table-wrap input[type="number"] {
            width: 80px;
            padding: 6px 8px;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
        }
        .order-table-wrap input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);

        async function replaceProductsForSupplier(supplier, products) {
    console.log('开始替换产品，供应商:', supplier, '产品数:', products.length);
    try {
        // 删除旧产品
        const { error: delError } = await supabaseClient.from('products').delete().eq('supplier', supplier);
        if (delError) {
            console.error('删除失败:', delError);
            throw delError;

        console.log('✅ 删除成功');

        if (products.length === 0) return;

        // 准备插入数据

            id: Math.floor(Date.now() + Math.random() * 1000000), // 确保整数
            code: p.code,
            short_name: p.shortName,
            full_name: p.fullName,
            supplier: supplier
        }));

        async function getOrders() {
            const { data, error } = await supabaseClient.from('orders').select('*');
            if (error) { console.error(error); return []; }
            return data || [];
        }

        async function addOrder(items, deliveryDate, note, customer, supplier) {
            const valid = items.filter(i => i.quantity > 0);
            if (valid.length === 0) return null;
            const newOrder = {
                id: 'ORD-' + new Date().toISOString().slice(0, 10) + '-' + Date.now().toString().slice(-6),
                supplier: supplier,
                customer: customer,
                items: valid.map(i => ({ productCode: i.code, productShort: i.shortName, productFull: i.fullName,
                    quantity: i.quantity })),
                delivery_date: deliveryDate,
                note: note || '',
                status: '待确认',
                response_note: '',
                order_date: new Date().toISOString().slice(0, 10),
                read: false
            };
            const { error } = await supabaseClient.from('orders').insert([newOrder]);
            if (error) throw error;
            return newOrder;
        }

        async function updateOrder(orderId, newItems, deliveryDate, note) {
            const { error } = await supabaseClient
                .from('orders')
                .update({
                    items: newItems,
                    delivery_date: deliveryDate,
                    note: note || ''
                })
                .eq('id', orderId);
            if (error) throw error;
        }

        async function respondOrder(orderId, status, responseNote) {
            const { error } = await supabaseClient
                .from('orders')
                .update({ status, response_note: responseNote || '' })
                .eq('id', orderId)
                .eq('status', '待确认');
            if (error) throw error;
            return true;
        }

        async function markOrderRead(orderId) {
            await supabaseClient.from('orders').update({ read: true }).eq('id', orderId);
        }

        async function getUnreadCount(supplier) {
            const { count, error } = await supabaseClient
                .from('orders')
                .select('id', { count: 'exact', head: true })
                .eq('supplier', supplier)
                .eq('status', '待确认')
                .eq('read', false);
            if (error) return 0;
            return count || 0;
        }

            const map = {
                '待确认': 'badge-warning',

                '已拒绝': 'badge-danger',
                '已完成': 'badge-success',
                '配送中': 'badge-info',
                '待审核': 'badge-warning',
                '待付款': 'badge-danger'
            };
            return map[status] || 'badge-secondary';
        }

        function getMinDeliveryDate() {

                                <input type="file" id="fileInput" accept=".xlsx,.xls" />
                            </div>
                            ${products.length === 0 ? '<div class="empty-state">暂无产品</div>' : `
                                <div class="products-grid">
                                    ${products.map(p => `
                                        <div class="product-card">
                                            <div class="product-code">${p.code}</div>
                                            <div class="product-short">${p.short_name}</div>
                                            <div class="product-full">${p.full_name}</div>
                                            <div class="product-supplier">${p.supplier}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>
                    `;
                    mainContent.innerHTML = html;
                    document.getElementById('uploadArea')?.addEventListener('click', () => document.getElementById('fileInput')
                        .click());
                    document.getElementById('fileInput')?.addEventListener('change', handleFileUpload);
                } else {
                    // 客户下单
                    html = `
                        <div class="fade-in">
                            <h1 class="page-title">🛒 下单采购</h1>
                            <p>选择产品输入数量，统一交期（≥28天）</p>
                            ${products.length === 0 ? '<div class="empty-state">暂无产品</div>' : `
                                <form id="orderForm">
                                    <div class="order-table-wrap">
                                        <table>
                                            <thead><tr><th>编码</th><th>简称</th><th>全称</th><th>数量</th></tr></thead>
                                            <tbody>
                                                ${products.map(p => `
                                                    <tr>
                                                        <td>${p.code}</td>
                                                        <td>${p.short_name}</td>
                                                        <td>${p.full_name}</td>
                                                        <td><input type="number" class="qty-input" data-code="${p.code}" data-short="${p.short_name}" data-full="${p.full_name}" min="0" value="0" step="1" /></td>
                                                    </tr>
                                                `).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="order-extra-fields">
                                        <div><label>交期</label><input type="date" id="deliveryDate" value="${getMinDeliveryDate()}" min="${getMinDeliveryDate()}" /></div>
                                        <div><label>备注</label><input type="text" id="orderNote" placeholder="特殊要求" /></div>
                                    </div>
                                    <button type="submit" class="btn btn-primary">提交订单</button>
                                </form>
                            `}
                        </div>
                    `;
                    mainContent.innerHTML = html;
                    if (products.length > 0) {
                        document.getElementById('orderForm').addEventListener('submit', function(e) {
                            e.preventDefault();
                            submitOrder(products);
                        });
                    }
                }
                return;
            }

            mainContent.innerHTML = html;
            // 绑定明细按钮（总览页）
            document.querySelectorAll('.view-detail-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const order = orders.find(o => o.id === this.dataset.orderid);
                    if (order) showOrderDetail(order);
                });
            });
        }

        // ============================================================
        // 导出订单
        // ============================================================
        async function exportOrders(orders) {
            if (!orders || orders.length === 0) { alert('无订单可导出'); return; }
            const rows = [
                ['物料编码', '产品名称', '下单数量', '交付时间', '是否同意接单']
            ];
            orders.forEach(o => {
                const statusText = o.status === '已同意' ? '同意' : o.status === '已拒绝' ? '拒绝' : o.status;
                if (o.items && o.items.length > 0) {
                    o.items.forEach(item => {
                        rows.push([
                            item.productCode || '',
                            item.productFull || item.productShort || '',
                            item.quantity || 0,
                            o.delivery_date || '',
                            statusText
                        ]);
                    });
                } else {
                    rows.push(['', '', '', o.delivery_date || '', statusText]);
                }
            });
            const csv = '\uFEFF' + rows.map(row => row.join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `订单_${currentUser.company}_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        // ============================================================
        // 上传Excel
        // ============================================================
        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(ev) {
                try {
                    const workbook = XLSX.read(ev.target.result, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                    console.log('📄 原始JSON:', json);  // ✅ 打印原始数据
                    
                    let products = [];
                    let start = 0;
                    if (json.length > 0 && json[0].some(c => /编码|简称|全称/i.test(c))) start = 1;
                    for (let i = start; i < json.length; i++) {
                        const row = json[i];
                        if (!row || row.length < 3) continue;
                        const code = String(row[0] || '').trim();
                        const shortName = String(row[1] || '').trim();
                        const fullName = String(row[2] || '').trim();
                        if (!code || !shortName || !fullName) continue;
                        products.push({ code, shortName, fullName });
                    }
                    console.log('📦 解析出的产品:', products);  // ✅ 打印解析结果

                    if (products.length === 0) { alert('未解析到有效数据'); return; }
                    const map = new Map();
                    products.forEach(p => map.set(p.code, p));
                    const unique = Array.from(map.values());
                    await replaceProductsForSupplier(currentUser.company, unique);
                    console.log('✅ 保存成功');
                    
                    alert(`导入 ${unique.length} 个产品`);
                    await renderMainContent(currentUser);
                    document.getElementById('fileInput').value = '';
                } catch (err) {
                    alert('解析失败: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // ============================================================
        // 客户下单
        // ============================================================
        async function submitOrder(products) {
            const items = [];
            document.querySelectorAll('.qty-input').forEach(input => {
                const qty = parseInt(input.value);
                if (qty > 0) {
                    items.push({
                        code: input.dataset.code,
                        shortName: input.dataset.short,
                        fullName: input.dataset.full,
                        quantity: qty
                    });
                }
            });
            if (items.length === 0) { alert('请至少选择一种产品'); return; }
            const delivery = document.getElementById('deliveryDate').value;
            if (!delivery) { alert('请选择交期'); return; }
            const diff = Math.ceil((new Date(delivery) - new Date()) / (1000 * 60 * 60 * 24));
            if (diff < 28) { alert('交期需≥28天'); return; }
            const note = document.getElementById('orderNote').value.trim();
            const supplier = products[0].supplier;
            const customer = currentUser.company;
            try {
                const newOrder = await addOrder(items, delivery, note, customer, supplier);
                if (newOrder) {
                    alert(`订单 ${newOrder.id} 已提交`);
                    currentNav = 'orders';
                    await renderSidebar(currentUser);
                    await renderMainContent(currentUser);
                }
            } catch (err) {
                alert('提交失败: ' + err.message);
            }
        }

        // ============================================================
        // 查看订单明细
        // ============================================================
        function showOrderDetail(order) {
            modalContainer.innerHTML = `
                <div class="modal-overlay" id="detailModalOverlay">
                    <div class="modal">
                        <h2>📄 订单明细</h2>
                        <p><strong>${order.id}</strong> | 客户: ${order.customer} | 供应商: ${order.supplier}</p>
                        <p>交期: ${order.delivery_date || '-'} | 状态: <span class="badge ${getStatusBadge(order.status)}">${order.status}</span></p>
                        ${order.response_note ? `<p>供应商反馈: ${order.response_note}</p>` : ''}
                        ${order.note ? `<p>客户备注: ${order.note}</p>` : ''}
                        <table>
                            <thead><tr><th>编码</th><th>简称</th><th>全称</th><th>数量</th></tr></thead>
                            <tbody>
                                ${order.items ? order.items.map(item => `
                                    <tr><td>${item.productCode||''}</td><td>${item.productShort||''}</td><td>${item.productFull||''}</td><td>${item.quantity}</td></tr>
                                `).join('') : '<tr><td colspan="4">无明细</td></tr>'}
                            </tbody>
                        </table>
                        <div class="form-actions"><button class="btn btn-outline" id="closeDetailBtn">关闭</button></div>
                    </div>
                </div>
            `;
            document.getElementById('closeDetailBtn').addEventListener('click', () => modalContainer.innerHTML = '');
            document.getElementById('detailModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) modalContainer.innerHTML = '';
            });
        }

        // ============================================================
        // 供应商反馈模态框
        // ============================================================
        function openResponseModal(orderId, action) {
            modalContainer.innerHTML = `
                <div class="modal-overlay" id="responseModalOverlay">
                    <div class="modal">
                        <h2>${action === 'agree' ? '同意' : '拒绝'}订单</h2>
                        <div class="form-group">
                            <label>备注</label>
                            <textarea id="responseNote" rows="3"></textarea>
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-outline" id="cancelResponseBtn">取消</button>
                            <button class="btn ${action === 'agree' ? 'btn-success' : 'btn-danger'}" id="confirmResponseBtn">确认</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('cancelResponseBtn').addEventListener('click', () => modalContainer.innerHTML = '');
            document.getElementById('confirmResponseBtn').addEventListener('click', async function() {
                const note = document.getElementById('responseNote').value.trim();
                const status = action === 'agree' ? '已同意' : '已拒绝';
                try {
                    await respondOrder(orderId, status, note);
                    alert(`订单已${status}`);
                    modalContainer.innerHTML = '';
                    await renderSidebar(currentUser);
                    await renderMainContent(currentUser);
                } catch (err) {
                    alert('操作失败: ' + err.message);
                }
            });
            document.getElementById('responseModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) modalContainer.innerHTML = '';
            });
        }

        // ============================================================
        // 客户编辑订单（修改数量）
        // ============================================================
        function openEditOrderModal(order) {
            let items = order.items.map(item => ({ ...item }));
            const modalHtml = `
                <div class="modal-overlay" id="editModalOverlay">
                    <div class="modal" style="max-width:700px;">
                        <h2>✏️ 编辑订单 ${order.id}</h2>
                        <p>修改产品数量（型号不可改），保存后更新</p>
                        <table>
                            <thead><tr><th>编码</th><th>产品名称</th><th>数量</th></tr></thead>
                            <tbody id="editItemsBody">
                                ${items.map((item, idx) => `
                                    <tr>
                                        <td>${item.productCode}</td>
                                        <td>${item.productFull || item.productShort}</td>
                                        <td><input type="number" class="edit-qty" data-index="${idx}" value="${item.quantity}" min="0" step="1" /></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                        <div class="form-group">
                            <label>交期</label>
                            <input type="date" id="editDeliveryDate" value="${order.delivery_date || ''}" min="${getMinDeliveryDate()}" />
                        </div>
                        <div class="form-group">
                            <label>备注</label>
                            <input type="text" id="editNote" value="${order.note || ''}" />
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-outline" id="cancelEditBtn">取消</button>
                            <button class="btn btn-primary" id="saveEditBtn">保存修改</button>
                        </div>
                    </div>
                </div>
            `;
            modalContainer.innerHTML = modalHtml;

            document.getElementById('saveEditBtn').addEventListener('click', async function() {
                const inputs = document.querySelectorAll('.edit-qty');
                const newItems = [];
                inputs.forEach(input => {
                    const idx = parseInt(input.dataset.index);
                    const qty = parseInt(input.value);
                    if (qty > 0) {
                        const original = items[idx];
                        newItems.push({
                            productCode: original.productCode,
                            productShort: original.productShort,
                            productFull: original.productFull,
                            quantity: qty
                        });
                    }
                });
                if (newItems.length === 0) {
                    alert('至少保留一种产品数量大于0');
                    return;
                }
                const delivery = document.getElementById('editDeliveryDate').value;
                if (!delivery) { alert('请选择交期'); return; }
                const diff = Math.ceil((new Date(delivery) - new Date()) / (1000 * 60 * 60 * 24));
                if (diff < 28) { alert('交期需≥28天'); return; }
                const note = document.getElementById('editNote').value.trim();
                try {
                    await updateOrder(order.id, newItems, delivery, note);
                    alert('订单已更新');
                    modalContainer.innerHTML = '';
                    await renderSidebar(currentUser);
                    await renderMainContent(currentUser);
                } catch (err) {
                    alert('更新失败: ' + err.message);
                }
            });

            document.getElementById('cancelEditBtn').addEventListener('click', () => modalContainer.innerHTML = '');
            document.getElementById('editModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) modalContainer.innerHTML = '';
            });
        }

        // ============================================================
        // 登录/退出
        // ============================================================
        async function handleLogin(username, password) {
            loginError.textContent = '';
            const user = USERS.find(u => u.username === username && u.password === password);
            if (!user) {
                loginError.textContent = '❌ 账号或密码错误';
                return;
            }
            currentUser = user;
            loginPage.classList.add('hidden');
            dashboardPage.classList.remove('hidden');
            currentNav = 'overview';
            await renderDashboard(user);
        }

        function handleLogout() {
            currentUser = null;
            dashboardPage.classList.add('hidden');
            loginPage.classList.remove('hidden');
            usernameInput.value = 'supplier1';
            passwordInput.value = '123456';
            loginError.textContent = '';
            modalContainer.innerHTML = '';
        }

        async function renderDashboard(user) {
            roleBadge.textContent = user.role === 'supplier' ? '供应商' : '客户';
            roleBadge.className = `role-badge role-badge-${user.role}`;
            userDisplayName.textContent = user.name;
            userCompany.textContent = user.company;
            userAvatar.textContent = user.name.charAt(0);
            await renderSidebar(user);
            await renderMainContent(user);
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            if (!username || !password) {
                loginError.textContent = '⚠️ 请输入账号和密码';
                return;
            }
            handleLogin(username, password);
        });

        logoutBtn.addEventListener('click', handleLogout);

        // 测试账号点击只填充，不自动登录
        document.querySelectorAll('.account-item').forEach(item => {
            item.addEventListener('click', function() {
                usernameInput.value = this.dataset.username;
                passwordInput.value = this.dataset.password;
                loginError.textContent = '';
            });
        });

        // ============================================================
        // 启动
        // ============================================================
        loginPage.classList.remove('hidden');
        dashboardPage.classList.add('hidden');
        usernameInput.value = 'supplier1';
        passwordInput.value = '123456';
        console.log('✅ 系统已启动，Supabase 客户端已创建');
    </script>
</body>
</html>

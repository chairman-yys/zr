        // ---- 备料计划 ----
        async function getStockPlans(supplier) {
            const { data, error } = await supabaseClient
                .from('stock_plans')
                .select('*')
                .eq('supplier', supplier);
            if (error) { console.error(error); return []; }
            return data || [];
        }

        // 批量更新备料计划
        async function batchUpdateStockPlans(supplier, planMap) {
            const existing = await getStockPlans(supplier);
            const existingMap = {};
            existing.forEach(p => { existingMap[p.product_code] = p; });

            const operations = [];
            for (const [code, qty] of Object.entries(planMap)) {
                const finalQty = Math.max(0, parseInt(qty) || 0);
                if (finalQty === 0) {
                    if (existingMap[code]) {
                        operations.push(
                            supabaseClient.from('stock_plans').delete().eq('id', existingMap[code].id)
                        );
                    }
                } else {
                    if (existingMap[code]) {
                        operations.push(
                            supabaseClient.from('stock_plans')
                            .update({ quantity: finalQty, updated_at: new Date() })
                            .eq('id', existingMap[code].id)
                        );
                    } else {
                        const newId = Math.floor(Date.now() + Math.random() * 1000000);
                        const product = (await getProducts()).find(p => p.code === code);
                        const name = product ? product.full_name : code;
                        operations.push(
                            supabaseClient.from('stock_plans').insert([{
                                id: newId,
                                product_code: code,
                                product_name: name,
                                quantity: finalQty,
                                supplier: supplier,
                                created_at: new Date(),
                                updated_at: new Date()
                            }])
                        );
                    }
                }
            }
            for (const op of operations) {
                const { error } = await op;
                if (error) throw error;
            }
        }

        // ---- 订单匹配备料计划（客户下单时调用） ----
        async function matchStockPlan(orderItems, customer, supplier, deliveryDate, note, forecastOrderId) {
            const plans = await getStockPlans(supplier);
            const planMap = {};
            plans.forEach(p => { planMap[p.product_code] = p.quantity; });

            const planItems = [];
            const extraItems = [];

            for (let item of orderItems) {
                const code = item.code;
                const orderQty = item.quantity;
                const planQty = planMap[code] || 0;

                if (planQty > 0) {
                    const consume = Math.min(orderQty, planQty);
                    planMap[code] = planQty - consume;
                    planItems.push({
                        productCode: code,
                        productShort: item.shortName,
                        productFull: item.fullName,
                        quantity: consume
                    });
                    if (orderQty > consume) {
                        extraItems.push({
                            productCode: code,
                            productShort: item.shortName,
                            productFull: item.fullName,
                            quantity: orderQty - consume
                        });
                    }
                } else {
                    extraItems.push({
                        productCode: code,
                        productShort: item.shortName,
                        productFull: item.fullName,
                        quantity: orderQty
                    });
                }
            }

            // 更新备料计划
            for (const [code, qty] of Object.entries(planMap)) {
                if (qty === 0) {
                    const existing = plans.find(p => p.product_code === code);
                    if (existing) {
                        await supabaseClient.from('stock_plans').delete().eq('id', existing.id);
                    }
                } else {
                    const existing = plans.find(p => p.product_code === code);
                    if (existing) {
                        await supabaseClient.from('stock_plans')
                            .update({ quantity: qty, updated_at: new Date() })
                            .eq('id', existing.id);
                    }
                }
            }

            const generatedOrders = [];

            if (planItems.length > 0) {
                const planOrder = {
                    id: 'ORD-PLAN-' + new Date().toISOString().slice(0, 10) + '-' + Date.now().toString().slice(-6),
                    supplier: supplier,
                    customer: customer,
                    items: planItems,
                    delivery_date: deliveryDate,
                    note: (note || '') + ' [来自备料计划, 预测单:' + forecastOrderId + ']',
                    status: '待确认',
                    response_note: '',
                    order_date: new Date().toISOString().slice(0, 10),
                    read: false
                };
                await createOrder(planOrder);
                generatedOrders.push(planOrder);
            }

            if (extraItems.length > 0) {
                const extraOrder = {
                    id: 'ORD-EXTRA-' + new Date().toISOString().slice(0, 10) + '-' + Date.now().toString().slice(-6),
                    supplier: supplier,
                    customer: customer,
                    items: extraItems,
                    delivery_date: deliveryDate,
                    note: (note || '') + ' [计划外, 预测单:' + forecastOrderId + ']',
                    status: '待确认',
                    response_note: '',
                    order_date: new Date().toISOString().slice(0, 10),
                    read: false
                };
                await createOrder(extraOrder);
                generatedOrders.push(extraOrder);
            }

            return generatedOrders;
        }

        async function addOrder(items, deliveryDate, note, customer, supplier) {
            const valid = items.filter(i => i.quantity > 0);
            if (valid.length === 0) return null;

            const forecastOrder = {
                id: 'FCAST-' + new Date().toISOString().slice(0, 10) + '-' + Date.now().toString().slice(-6),
                supplier: supplier,
                customer: customer,
                items: valid.map(i => ({ productCode: i.code, productShort: i.shortName, productFull: i.fullName,
                    quantity: i.quantity })),
                delivery_date: deliveryDate,
                note: (note || '') + ' [预测订单]',
                status: '已处理',
                response_note: '',
                order_date: new Date().toISOString().slice(0, 10),
                read: false
            };
            await createOrder(forecastOrder);

            const planOrders = await matchStockPlan(valid, customer, supplier, deliveryDate, note, forecastOrder.id);
            return planOrders;
        }

                '已拒绝': 'badge-danger',
                '已完成': 'badge-success',
                '配送中': 'badge-info',

            return map[status] || 'badge-secondary';

            });

            // 删除订单（供应商）
            document.querySelectorAll('.delete-order-btn').forEach(btn => {
                btn.addEventListener('click', async function() {
                    const orderId = this.dataset.orderid;
                    if (!confirm(`确定删除订单 ${orderId} 吗？`)) return;
                    try {
                        await supabaseClient.from('orders').delete().eq('id', orderId);
                        alert('已删除');
                        const freshOrders = await getOrders();
                        const actual = freshOrders.filter(o => !o.note?.includes('[预测订单]'));
                        const userOrders = actual.filter(o =>
                            currentUser.role === 'supplier' ? o.supplier === currentUser.company : o.customer ===
                            currentUser.company
                        );
                        renderOrderTable(userOrders, currentUser.role === 'supplier');
                        await renderSidebar(currentUser);
                    } catch (err) { alert('删除失败: ' + err.message); }
                });
            });
        }

        // ============================================================
        // 导出、上传、提交等功能
        // ============================================================
        async function exportOrders(orders) {
            if (!orders || orders.length === 0) { alert('无订单可导出'); return; }
            const rows = [
                ['物料编码', '产品名称', '下单数量', '交付时间', '是否同意接单']
            ];
            orders.forEach(o => {
                const statusText = o.status === '已同意' ? '同意' : o.status === '已拒绝' ? '拒绝' : o.status;
                if (o.items && Array.isArray(o.items)) {
                    o.items.forEach(item => {
                        rows.push([
                            item.productCode || '',
                            item.productFull || item.productShort || '',
                            item.quantity || 0,
                            o.delivery_date || '',
                            statusText
                        ]);
                    });
                } else {
                    rows.push(['', '', '', o.delivery_date || '', statusText]);
                }
            });
            const csv = '\uFEFF' + rows.map(row => row.join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `订单_${currentUser.company}_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(ev) {
                try {
                    const workbook = XLSX.read(ev.target.result, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                    let products = [];
                    let start = 0;
                    if (json.length > 0 && json[0].some(c => /编码|简称|全称/i.test(c))) start = 1;
                    for (let i = start; i < json.length; i++) {
                        const row = json[i];
                        if (!row || row.length < 3) continue;
                        const code = String(row[0] || '').trim();
                        const shortName = String(row[1] || '').trim();
                        const fullName = String(row[2] || '').trim();
                        if (!code || !shortName || !fullName) continue;
                        products.push({ code, shortName, fullName });
                    }
                    if (products.length === 0) { alert('未解析到有效数据'); return; }
                    const map = new Map();
                    products.forEach(p => map.set(p.code, p));
                    const unique = Array.from(map.values());
                    await replaceProductsForSupplier(currentUser.company, unique);
                    alert(`导入 ${unique.length} 个产品`);
                    await renderMainContent(currentUser);
                    document.getElementById('fileInput').value = '';
                } catch (err) {
                    console.error(err);
                    alert('解析失败: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function submitOrder(products) {
            const items = [];
            document.querySelectorAll('.qty-input').forEach(input => {
                const qty = parseInt(input.value);
                if (qty > 0) {
                    items.push({
                        code: input.dataset.code,
                        shortName: input.dataset.short,
                        fullName: input.dataset.full,
                        quantity: qty
                    });
                }
            });
            if (items.length === 0) { alert('请至少选择一种产品'); return; }
            const delivery = document.getElementById('deliveryDate').value;
            if (!delivery) { alert('请选择交期'); return; }
            const diff = Math.ceil((new Date(delivery) - new Date()) / (1000 * 60 * 60 * 24));
            if (diff < 28) { alert('交期需≥28天'); return; }
            const note = document.getElementById('orderNote').value.trim();
            const supplier = products[0].supplier;
            const customer = currentUser.company;
            try {
                const generated = await addOrder(items, delivery, note, customer, supplier);
                if (generated && generated.length > 0) {
                    alert(`已生成 ${generated.length} 个订单（含备料匹配）`);
                    currentNav = 'orders';
                    await renderSidebar(currentUser);
                    await renderMainContent(currentUser);
                } else {
                    alert('订单生成失败');
                }
            } catch (err) {
                alert('提交失败: ' + err.message);
            }
        }

        // ============================================================
        // 模态框（查看、响应、编辑）
        // ============================================================
        function showOrderDetail(order) {
            modalContainer.innerHTML = `
                <div class="modal-overlay" id="detailModalOverlay">
                    <div class="modal">
                        <h2>订单明细</h2>
                        <div class="modal-sub"><strong>${order.id}</strong> | ${order.customer} → ${order.supplier}</div>
                        <p>交期: ${order.delivery_date || '-'} | 状态: <span class="badge ${getStatusBadge(order.status)}">${order.status}</span></p>
                        ${order.response_note ? `<p>供应商反馈: ${order.response_note}</p>` : ''}
                        ${order.note ? `<p>备注: ${order.note}</p>` : ''}
                        <table>
                            <thead><tr><th>编码</th><th>简称</th><th>全称</th><th style="text-align:right;">数量</th></tr></thead>
                            <tbody>
                                ${order.items && Array.isArray(order.items) ? order.items.map(item => `
                                    <tr><td>${item.productCode||''}</td><td>${item.productShort||''}</td><td>${item.productFull||''}</td><td style="text-align:right;">${item.quantity || 0}</td></tr>
                                `).join('') : '<tr><td colspan="4">无明细</td></tr>'}
                            </tbody>
                        </table>
                        <div class="form-actions"><button class="btn btn-outline" id="closeDetailBtn">关闭</button></div>
                    </div>
                </div>
            `;
            document.getElementById('closeDetailBtn').addEventListener('click', () => modalContainer.innerHTML = '');
            document.getElementById('detailModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) modalContainer.innerHTML = '';
            });
        }

        function openResponseModal(orderId, action) {
            modalContainer.innerHTML = `
                <div class="modal-overlay" id="responseModalOverlay">
                    <div class="modal">
                        <h2>${action === 'agree' ? '同意' : '拒绝'}订单</h2>
                        <div class="modal-sub">订单号: ${orderId}</div>
                        <div class="form-group">
                            <label>备注</label>
                            <textarea id="responseNote" rows="3"></textarea>
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-outline" id="cancelResponseBtn">取消</button>
                            <button class="btn ${action === 'agree' ? 'btn-success' : 'btn-danger'}" id="confirmResponseBtn">确认</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('cancelResponseBtn').addEventListener('click', () => modalContainer.innerHTML = '');
            document.getElementById('confirmResponseBtn').addEventListener('click', async function() {
                const note = document.getElementById('responseNote').value.trim();
                const status = action === 'agree' ? '已同意' : '已拒绝';
                try {
                    await supabaseClient
                        .from('orders')
                        .update({ status, response_note: note || '' })
                        .eq('id', orderId)
                        .eq('status', '待确认');
                    alert(`订单已${status}`);
                    modalContainer.innerHTML = '';
                    await renderSidebar(currentUser);
                    await renderMainContent(currentUser);
                } catch (err) { alert('操作失败: ' + err.message); }
            });
            document.getElementById('responseModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) modalContainer.innerHTML = '';
            });
        }

        function openEditOrderModal(order) {
            let items = order.items ? order.items.map(item => ({ ...item })) : [];
            const modalHtml = `
                <div class="modal-overlay" id="editModalOverlay">
                    <div class="modal" style="max-width:700px;">
                        <h2>编辑订单 ${order.id}</h2>
                        <p style="color:#64748b;margin-bottom:12px;">修改产品数量</p>
                        <table>
                            <thead><tr><th>编码</th><th>产品名称</th><th style="width:100px;">数量</th></tr></thead>
                            <tbody id="editItemsBody">
                                ${items.map((item, idx) => `
                                    <tr>
                                        <td>${item.productCode || ''}</td>
                                        <td>${item.productFull || item.productShort || ''}</td>
                                        <td><input type="number" class="edit-qty" data-index="${idx}" value="${item.quantity || 0}" min="0" step="1" style="width:70px;padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;" /></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                        <div class="form-group" style="margin-top:14px;">
                            <label>交期</label>
                            <input type="date" id="editDeliveryDate" value="${order.delivery_date || ''}" min="${getMinDeliveryDate()}" />
                        </div>
                        <div class="form-group">
                            <label>备注</label>
                            <input type="text" id="editNote" value="${order.note || ''}" />
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-outline" id="cancelEditBtn">取消</button>
                            <button class="btn btn-primary" id="saveEditBtn">保存</button>
                        </div>
                    </div>
                </div>
            `;
            modalContainer.innerHTML = modalHtml;

            document.getElementById('saveEditBtn').addEventListener('click', async function() {
                const inputs = document.querySelectorAll('.edit-qty');
                const newItems = [];
                inputs.forEach(input => {
                    const idx = parseInt(input.dataset.index);
                    const qty = parseInt(input.value);
                    if (qty > 0) {
                        const original = items[idx];
                        newItems.push({
                            productCode: original.productCode || '',
                            productShort: original.productShort || '',
                            productFull: original.productFull || '',
                            quantity: qty
                        });
                    }
                });
                if (newItems.length === 0) { alert('至少保留一种产品'); return; }
                const delivery = document.getElementById('editDeliveryDate').value;
                if (!delivery) { alert('请选择交期'); return; }
                const diff = Math.ceil((new Date(delivery) - new Date()) / (1000 * 60 * 60 * 24));
                if (diff < 28) { alert('交期需≥28天'); return; }
                const note = document.getElementById('editNote').value.trim();
                try {
                    await supabaseClient
                        .from('orders')
                        .update({ items: newItems, delivery_date: delivery, note: note || '' })
                        .eq('id', order.id);
                    alert('订单已更新');
                    modalContainer.innerHTML = '';
                    await renderSidebar(currentUser);
                    await renderMainContent(currentUser);
                } catch (err) { alert('更新失败: ' + err.message); }
            });

            document.getElementById('cancelEditBtn').addEventListener('click', () => modalContainer.innerHTML = '');
            document.getElementById('editModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) modalContainer.innerHTML = '';
            });
        }

        // ============================================================
        // 登录/退出
        // ============================================================
        async function handleLogin(username, password) {
            loginError.textContent = '';
            const user = USERS.find(u => u.username === username && u.password === password);
            if (!user) {
                loginError.textContent = '账号或密码错误';
                return;
            }
            currentUser = user;
            loginPage.classList.add('hidden');
            dashboardPage.classList.remove('hidden');
            currentNav = 'overview';
            await renderDashboard(user);
        }

        function handleLogout() {
            currentUser = null;
            dashboardPage.classList.add('hidden');
            loginPage.classList.remove('hidden');
            usernameInput.value = 'supplier1';
            passwordInput.value = '123456';
            loginError.textContent = '';
            modalContainer.innerHTML = '';
        }

        async function renderDashboard(user) {
            roleBadge.textContent = user.role === 'supplier' ? '供应商' : '客户';
            roleBadge.className = `role-badge role-badge-${user.role}`;
            userDisplayName.textContent = user.name;
            userCompany.textContent = user.company;
            userAvatar.textContent = user.name.charAt(0);
            await renderSidebar(user);
            await renderMainContent(user);
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            if (!username || !password) {
                loginError.textContent = '请输入账号和密码';
                return;
            }
            handleLogin(username, password);
        });

        logoutBtn.addEventListener('click', handleLogout);

        // ============================================================
        // 启动
        // ============================================================
        loginPage.classList.remove('hidden');
        dashboardPage.classList.add('hidden');
        usernameInput.value = 'supplier1';
        passwordInput.value = '123456';
        console.log('系统已启动（订单数量显示已修复）');
    </script>
</body>
</html>
